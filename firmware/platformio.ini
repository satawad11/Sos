; Patient SOS button — Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262), LoRaWAN AS923 (Thailand)
[platformio]
default_envs = heltec_v3

[env:heltec_v3]
platform = espressif32@^6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@7.2.1
    olikraus/U8g2@^2.35.30
build_flags =
    -D FW_MAJOR=0
    -D FW_MINOR=10
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    ; ---- per-hardware options (see include/config.h) ----
    ; -D SOS_DEBUG_FAST_TIMERS=1   ; shorter timeouts for bench testing

; Same firmware + optional GPS module on UART1 (pins in include/config.h). Experimental until verified on hardware.
[env:heltec_v3_gps]
extends = env:heltec_v3
build_flags =
    ${env:heltec_v3.build_flags}
    -D SOS_GPS=1

; Heltec WiFi LoRa 32 V2 (ESP32 + SX1276). EXPERIMENTAL port — needs the 868–915 MHz variant (NOT the 433 MHz one)
[env:heltec_v2]
platform = espressif32@^6.9.0
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@7.2.1
    olikraus/U8g2@^2.35.30
build_flags =
    -D FW_MAJOR=0
    -D FW_MINOR=10
    -D CORE_DEBUG_LEVEL=0
    -D SOS_BOARD_V2=1

; Heltec WiFi LoRa 32 V2.0 (silkscreen says V2 but NOT V2.1): battery sense is on GPIO13, so the button is on GPIO23
[env:heltec_v2_0]
extends = env:heltec_v2
build_flags =
    ${env:heltec_v2.build_flags}
    -D SOS_BOARD_V2_0=1
