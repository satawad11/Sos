<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบแจ้งเหตุฉุกเฉิน รพ.สต.</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mut:#6b7885;--red:#c62828;--grn:#2e7d32;--amb:#ef6c00;--bd:#dde3e8;--pri:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#1a232c;--ink:#e6edf3;--mut:#93a1ad;--bd:#2c3a46}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--pri);color:#fff;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.btn{border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--bd)}
nav button{background:transparent;color:#fff;border-color:transparent}nav button.on{background:#ffffff33}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.g{background:var(--grn);color:#fff;border-color:var(--grn)}.btn.r{background:var(--red);color:#fff;border-color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.new{background:var(--red);color:#fff;border-color:var(--red)}.accepted{background:var(--amb);color:#fff;border-color:var(--amb)}.closed{background:var(--grn);color:#fff;border-color:var(--grn)}
.alarm{border:3px solid var(--red);animation:b 1s infinite}@keyframes b{50%{background:#c6282833}}
input,select,textarea{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.mut{color:var(--mut)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;display:none}
#login{max-width:340px;margin:12vh auto}.warn{background:#fff3cd;color:#664d03;padding:8px 12px;border-radius:8px}
@media print{body *{visibility:hidden}#plabel,#plabel *{visibility:visible}#plabel{position:absolute;left:0;top:0;border:1px solid #000;padding:6px;width:60mm;color:#000;background:#fff}}
.step{display:flex;gap:8px;align-items:flex-start;margin:4px 0}.ok{color:var(--grn)}.bad{color:var(--red)}
</style></head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=iso=>iso?new Date(iso).toLocaleString("th-TH-u-ca-buddhist",{timeZone:"Asia/Bangkok",dateStyle:"short",timeStyle:"medium"}):"-";
const ST={new:"รอรับเรื่อง",accepted:"รับเรื่องแล้ว",closed:"ปิดเคส",cancelled:"ยกเลิกโดยผู้ป่วย"};
let token=sessionStorage.getItem("tk")||"",role=sessionStorage.getItem("role")||"",page="cases",ws=null,timer=null,audioOn=false;
async function api(path,opt={}){
  const r=await fetch("/api"+path,{...opt,headers:{"content-type":"application/json",...(token?{authorization:"Bearer "+token}:{}),...(opt.headers||{})},body:opt.body&&JSON.stringify(opt.body)});
  if(r.status===401&&path!=="/login"){logout();throw new Error("หมดเวลา กรุณาเข้าสู่ระบบใหม่")}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||("ผิดพลาด "+r.status));return j}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3500)}
const guard=f=>async(...a)=>{try{return await f(...a)}catch(e){toast(e.message)}};
function logout(){token="";sessionStorage.clear();if(ws)ws.close();render()}
function beep(){if(!audioOn)return;try{const c=new AudioContext(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},700)}catch{}}
function connectWS(){
  if(ws)ws.close();ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/ws?token="+encodeURIComponent(token));
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="case_new"){beep();toast("🚨 มีเหตุฉุกเฉินใหม่")}if(page==="cases")loadCases()};
  ws.onclose=()=>{if(token)setTimeout(connectWS,3000)}}

function render(){
  if(!token){$("#app").innerHTML=`<div class="card" id="login"><h2>เข้าสู่ระบบ</h2><div class="row"><input id="u" placeholder="ชื่อผู้ใช้" autocomplete="username"></div><div class="row"><input id="p" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"></div><button class="btn p" id="go">เข้าสู่ระบบ</button></div>`;
    $("#go").onclick=guard(async()=>{const r=await api("/login",{method:"POST",body:{username:$("#u").value,password:$("#p").value}});token=r.token;role=r.role;sessionStorage.setItem("tk",token);sessionStorage.setItem("role",role);render()});
    $("#p").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};return}
  const tabs=[["cases","เคสฉุกเฉิน"],["patients","ผู้ป่วย"],["caregivers","อสม./ผู้ดูแล"],["devices","อุปกรณ์"],...(role==="admin"?[["install","ติดตั้งอุปกรณ์"]]:[]),["settings","ตั้งค่า"],["audit","บันทึกการใช้งาน"]];
  $("#app").innerHTML=`<header><h1>🚑 ระบบแจ้งเหตุฉุกเฉิน</h1><nav>${tabs.map(t=>`<button data-p="${t[0]}" class="${page===t[0]?"on":""}">${t[1]}</button>`).join("")}</nav><button class="btn" id="snd">${audioOn?"🔔 เสียงเปิด":"🔕 เปิดเสียงเตือน"}</button><button class="btn" id="out">ออก</button></header><main id="main"></main>`;
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});
  $("#out").onclick=logout;$("#snd").onclick=()=>{audioOn=!audioOn;beep();render()};
  clearInterval(timer);(({cases:loadCases,patients:loadPatients,caregivers:loadCaregivers,devices:loadDevices,install:loadInstall,settings:loadSettings,audit:loadAudit})[page])();
  if(page==="cases"||page==="devices")timer=setInterval(()=>{if(page==="cases")loadCases();else if(!devEdit)loadDevices()},15000);
  if(!ws||ws.readyState>1)connectWS()}

let devEdit=false;
const canEdit=()=>role==="admin"||role==="staff";
const loadCases=guard(async()=>{
  const [open,recent,st,gw]=await Promise.all([api("/cases?state=new,accepted"),api("/cases?limit=30"),api("/stats"),api("/gateways")]);
  if(page!=="cases")return;
  const row=c=>`<tr><td>#${c.id}</td><td>${esc(c.patient?c.patient.full_name:"(ไม่ทราบผู้ป่วย) "+c.device.dev_eui)}<div class="mut">${esc(c.patient?.address||"")} ${c.patient?.phone?`📞 ${esc(c.patient.phone)}`:""}</div></td><td><span class="tag ${c.state}">${ST[c.state]}</span>${c.overdue&&c.state==="new"?' <b style="color:var(--red)">เกินเวลา!</b>':""}${c.after_hours?' <span class="tag">นอกเวลา</span>':""}</td><td>${fmt(c.created_at)}</td><td>${esc(c.accepted_by)}</td><td><button class="btn" data-id="${c.id}" data-a="view">รายละเอียด</button></td></tr>`;
  const gwBad=gw.filter(g=>g.offline);
  $("#main").innerHTML=`${gwBad.length?`<div class="warn">⚠️ Gateway ขาดการเชื่อมต่อ: ${gwBad.map(g=>esc(g.gateway_id)).join(", ")}</div>`:""}
  <div class="card ${open.some(c=>c.state==="new")?"alarm":""}"><h3>เคสที่ยังเปิดอยู่ (${open.length})</h3>${open.length?`<table><tr><th>#</th><th>ผู้ป่วย</th><th>สถานะ</th><th>เวลา</th><th>ผู้รับเรื่อง</th><th></th></tr>${open.map(row).join("")}</table>`:'<p class="mut">ไม่มีเคสค้าง</p>'}</div>
  <div class="card"><b>30 วัน:</b> ${st.cases_30d} เคส · เหตุผิดพลาด ${st.false_alarm} · นอกเวลา ${st.after_hours} · เวลารับเรื่องเฉลี่ย ${st.avg_accept_s??"-"} วินาที</div>
  <div class="card"><h3>ล่าสุด</h3><table><tr><th>#</th><th>ผู้ป่วย</th><th>สถานะ</th><th>เวลา</th><th>ผู้รับเรื่อง</th><th></th></tr>${recent.map(row).join("")}</table></div>`;
  document.querySelectorAll("[data-a=view]").forEach(b=>b.onclick=()=>showCase(b.dataset.id))});
const showCase=guard(async id=>{
  const c=await api("/cases/"+id);
  $("#main").innerHTML=`<button class="btn" id="back">← กลับ</button><div class="card"><h2>เคส #${c.id} <span class="tag ${c.state}">${ST[c.state]}</span></h2>
  <p><b>${esc(c.patient?.full_name||"ไม่ทราบผู้ป่วย")}</b><br>${esc(c.patient?.address||"")} ${esc(c.patient?.village||"")}<br>${c.patient?.phone?`📞 <a href="tel:${esc(c.patient.phone)}">${esc(c.patient.phone)}</a>`:""} ${c.patient?.lat!=null?`· <a target="_blank" rel="noopener" href="https://maps.google.com/?q=${c.patient.lat},${c.patient.lon}">แผนที่</a>`:""}</p>
  <p class="mut">${esc(c.patient?.notes||"")}</p>
  <p>อุปกรณ์ ${esc(c.device.label)} (${c.device.dev_eui}) · แบต ${c.device.battery??"-"}% · ไฟบ้าน ${c.device.mains_ok===false?"ดับ":"ปกติ"}</p>
  ${canEdit()&&c.state==="new"?`<button class="btn g" id="acc">✅ รับเรื่อง (ส่งสัญญาณกลับอุปกรณ์)</button> `:""}
  ${canEdit()&&(c.state==="new"||c.state==="accepted")?`<div class="row"><input id="note" placeholder="บันทึก (ถ้ามี)" size="40"><button class="btn p" id="cls">ปิดเคส</button><button class="btn r" id="fal">เหตุผิดพลาด</button></div>`:""}
  </div><div class="card"><h3>ไทม์ไลน์</h3><table>${c.events.map(e=>`<tr><td>${fmt(e.at)}</td><td>${esc(e.kind)}</td><td>${esc(e.actor)}</td><td class="mut">${esc(JSON.stringify(e.detail))}</td></tr>`).join("")}</table></div>`;
  $("#back").onclick=()=>render();
  const act=(url,body)=>guard(async()=>{await api(url,{method:"POST",body});toast("บันทึกแล้ว");showCase(id)});
  if($("#acc"))$("#acc").onclick=act(`/cases/${id}/accept`);
  if($("#cls"))$("#cls").onclick=()=>act(`/cases/${id}/close`,{reason:"resolved",note:$("#note").value})();
  if($("#fal"))$("#fal").onclick=()=>act(`/cases/${id}/close`,{reason:"false_alarm",note:$("#note").value})()});

const loadPatients=guard(async()=>{
  const [ps,cs]=await Promise.all([api("/patients"),api("/caregivers")]);
  const opts=cs.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.full_name)}</option>`).join("");
  $("#main").innerHTML=`${canEdit()?`<div class="card"><h3>เพิ่มผู้ป่วย</h3><div class="row"><input id="n" placeholder="ชื่อ-สกุล"><input id="a" placeholder="ที่อยู่" size="30"><input id="v" placeholder="หมู่บ้าน"><input id="ph" placeholder="โทร"><input id="la" placeholder="ละติจูด" size="9"><input id="lo" placeholder="ลองจิจูด" size="9"><button class="btn p" id="add">เพิ่ม</button></div></div>`:""}
  <div class="card"><table><tr><th>ชื่อ</th><th>ที่อยู่/โทร</th><th>อุปกรณ์</th><th>ผู้ดูแล (ลำดับแจ้ง)</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.address)}<br>${esc(p.phone)}</td><td>${esc(p.device||"-")}</td><td>${p.assignments.map(a=>a.priority+". "+esc(a.name)).join("<br>")||'<span class="mut">ยังไม่กำหนด</span>'}</td><td>${canEdit()?`<button class="btn" data-id="${p.id}">กำหนดผู้ดูแล</button>`:""}</td></tr>`).join("")}</table></div>`;
  if($("#add"))$("#add").onclick=guard(async()=>{const num=v=>v===""?null:Number(v);await api("/patients",{method:"POST",body:{full_name:$("#n").value,address:$("#a").value,village:$("#v").value,phone:$("#ph").value,lat:num($("#la").value),lon:num($("#lo").value)}});loadPatients()});
  document.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{const p=ps.find(x=>x.id==b.dataset.id);
    $("#main").innerHTML=`<button class="btn" id="back">← กลับ</button><div class="card"><h3>ผู้ดูแลของ ${esc(p.full_name)}</h3><p class="mut">ลำดับที่ 1 จะได้รับแจ้งก่อน ถ้าไม่ตอบรับภายในเวลาที่ตั้งไว้ จะแจ้งคนถัดไป</p>${[1,2,3].map(i=>`<div class="row">ลำดับ ${i}: <select id="s${i}"><option value="">- ไม่ระบุ -</option>${opts}</select></div>`).join("")}<button class="btn p" id="sv">บันทึก</button></div>`;
    p.assignments.forEach(a=>{$("#s"+a.priority).value=a.caregiver_id});
    $("#back").onclick=()=>render();$("#sv").onclick=guard(async()=>{const ids=[1,2,3].map(i=>$("#s"+i).value).filter(Boolean).map(Number);await api(`/patients/${p.id}/assignments`,{method:"PUT",body:{caregiver_ids:ids}});toast("บันทึกแล้ว");render()})})});

const loadCaregivers=guard(async()=>{
  const cs=await api("/caregivers");
  $("#main").innerHTML=`${canEdit()?`<div class="card"><h3>เพิ่ม อสม./ผู้ดูแล</h3><div class="row"><input id="n" placeholder="ชื่อ-สกุล"><input id="r" value="อสม."><input id="ph" placeholder="โทร"><button class="btn p" id="add">เพิ่ม</button></div></div>`:""}
  <div class="card"><table><tr><th>ชื่อ</th><th>บทบาท</th><th>โทร</th><th>LINE</th><th></th></tr>${cs.map(c=>`<tr><td>${esc(c.full_name)}${c.active?"":" (ปิดใช้งาน)"}</td><td>${esc(c.role)}</td><td>${esc(c.phone)}</td><td>${c.line_bound?"✅ ผูกแล้ว":"❌ ยังไม่ผูก"}</td><td>${canEdit()?`<button class="btn" data-bind="${c.id}">สร้างรหัสผูก LINE</button>${c.line_bound?` <button class="btn" data-un="${c.id}">ยกเลิกผูก</button>`:""}`:""}</td></tr>`).join("")}</table><p class="mut">วิธีผูก: กดสร้างรหัส → ให้ อสม. เพิ่มเพื่อนบัญชี LINE ของ รพ.สต. แล้วพิมพ์รหัสนั้นส่งไป (รหัสใช้ได้ 30 นาที ครั้งเดียว)</p></div>`;
  if($("#add"))$("#add").onclick=guard(async()=>{await api("/caregivers",{method:"POST",body:{full_name:$("#n").value,role:$("#r").value,phone:$("#ph").value}});loadCaregivers()});
  document.querySelectorAll("[data-bind]").forEach(b=>b.onclick=guard(async()=>{const r=await api(`/caregivers/${b.dataset.bind}/bind-code`,{method:"POST"});alert("รหัสผูก LINE: "+r.code+"\nหมดอายุใน "+r.expires_minutes+" นาที")}));
  document.querySelectorAll("[data-un]").forEach(b=>b.onclick=guard(async()=>{if(confirm("ยกเลิกการผูก LINE?")){await api(`/caregivers/${b.dataset.un}/unbind`,{method:"POST"});loadCaregivers()}}))});

const loadDevices=guard(async()=>{
  const [ds,ps]=await Promise.all([api("/devices"),api("/patients")]);if(page!=="devices")return;
  const LC=["ready","active","repair","retired","lost"];
  $("#main").innerHTML=`<div class="card"><table><tr><th>ป้าย</th><th>DevEUI</th><th>สถานะ</th><th>ผู้ป่วย</th><th>แบต/ไฟ</th><th>สัญญาณ</th><th>เห็นล่าสุด</th><th>fw</th><th></th></tr>${ds.map(d=>`<tr><td>${esc(d.label)}${Object.keys(d.config_override||{}).length?' <span class="tag" title="ใช้ค่าเฉพาะเครื่อง">ค่าเฉพาะ</span>':""}${d.config_pending?' <span class="tag" style="color:var(--amb)" title="ค่าใหม่ยังไม่ถึงเครื่อง">⏳ รอเครื่องรับค่า</span>':""}</td><td><code>${d.dev_eui}</code></td><td>${d.lifecycle}${d.offline?' <b style="color:var(--red)">ออฟไลน์</b>':""}</td><td>${esc(d.patient||"-")}</td><td>${d.battery==null||d.battery===255?"-":d.battery+"%"} ${d.mains_ok===false?"⚡ไฟดับ":""}</td><td>${d.rssi??"-"} dBm / ${d.snr??"-"}</td><td>${fmt(d.last_seen)}</td><td>${esc(d.fw)}</td><td>${canEdit()?`<button class="btn" data-id="${d.id}">แก้ไข</button>`:""}</td></tr>`).join("")}</table><p class="mut">อุปกรณ์ใหม่ลงทะเบียนอัตโนมัติจากเครื่องมือ provision (สถานะ ready) → ผูกผู้ป่วยแล้วตั้งเป็น active ก่อนติดตั้งที่บ้าน</p></div>`;
  document.querySelectorAll("button[data-id]").forEach(b=>b.onclick=guard(async()=>{const d=ds.find(x=>x.id==b.dataset.id);devEdit=true;
    const dd=(await api("/settings")).device_defaults;
    const CF=[["heartbeat_min","Heartbeat (นาที)",5,1275,"เครื่องรายงานสถานะทุกกี่นาที (ยิ่งถี่ยิ่งกินแบต)"],["poll_s","Poll (วินาที)",5,120,"ช่วงถามผลรับเรื่องระหว่างมีเหตุ"],["buzzer","เสียงบัซเซอร์ (0-3)",0,3,"0=ปิด 1=เบา 2=ปกติ 3=ดัง"],["hold_ms","กดปุ่มค้าง (ms)",500,5000,"ต้องกดค้างนานเท่าไรจึงนับเป็นการแจ้งเหตุ"]];
    const ov=d.config_override||{};
    const cfgCard=canEdit()?`<div class="card"><h3>ตั้งค่าเครื่องนี้</h3>
      <p class="mut">ค่าที่ไม่ติ๊ก "ค่าเฉพาะ" จะใช้ค่ากลางจากหน้าตั้งค่า ระบบส่งค่าใหม่ให้เครื่องเองตอนเครื่องรายงานสถานะรอบถัดไป (อาจใช้เวลาถึง 2 รอบ heartbeat) ไม่ต้องเดินไปที่เครื่อง</p>
      ${CF.map(([k,t,lo,hi,h])=>`<div class="row"><label style="min-width:190px"><input type="checkbox" class="ck" data-k="${k}" ${k in ov?"checked":""}> ${t}</label><input type="number" class="cv" data-k="${k}" min="${lo}" max="${hi}" value="${k in ov?ov[k]:dd[k]}" ${k in ov?"":"disabled"}><span class="mut">ค่ากลาง ${dd[k]} · ช่วง ${lo}-${hi} · ${h}</span></div>`).join("")}
      <div class="row">สถานะ: ${d.config_pending?'<b style="color:var(--amb)">⏳ รอเครื่องรับค่า</b>':d.config_applied_at?"✅ เครื่องใช้ค่านี้แล้ว (เมื่อ "+fmt(d.config_applied_at)+")":"✅ ตรงกับค่าที่ตั้ง"} · เวอร์ชันค่า ${d.config_ver}</div>
      <div class="row"><button class="btn p" id="svc">ส่งค่าไปยังเครื่อง</button><button class="btn" id="rsc">กลับไปใช้ค่ากลางทั้งหมด</button></div></div>`:"";
    $("#main").innerHTML=`<button class="btn" id="back">← กลับ</button><div class="card"><h3>${d.dev_eui}</h3><div class="row">ป้าย <input id="l" value="${esc(d.label)}"></div><div class="row">สถานะ <select id="lc">${LC.map(x=>`<option ${x===d.lifecycle?"selected":""}>${x}</option>`).join("")}</select></div><div class="row">ผู้ป่วย <select id="pt"><option value="">- ไม่ผูก -</option>${ps.map(p=>`<option value="${p.id}" ${p.id===d.patient_id?"selected":""}>${esc(p.full_name)}</option>`).join("")}</select></div><button class="btn p" id="sv">บันทึก</button></div>${cfgCard}`;

// ---------------------------------------------------------------- USB provisioning (Web Serial)
class SerialLink{
  constructor(){this.port=null;this.lines=[];this.waiters=[];this.buf="";this.writer=null;this.reader=null;this.closed=false}
  static supported(){return "serial" in navigator}
  async open(){
    this.port=await navigator.serial.requestPort();await this.port.open({baudRate:115200});
    this.writer=this.port.writable.getWriter();this.reader=this.port.readable.getReader();this._pump()}
  async _pump(){const dec=new TextDecoder();
    try{for(;;){const {value,done}=await this.reader.read();if(done)break;this.buf+=dec.decode(value,{stream:true});
      let i;while((i=this.buf.search(/\r?\n/))>=0){const l=this.buf.slice(0,i).trim();this.buf=this.buf.slice(i).replace(/^\r?\n/,"");if(l){this.lines.push(l);this._wake()}}}}catch{}
    this.closed=true;this._wake()}
  _wake(){this.waiters.splice(0).forEach(f=>f())}
  async send(cmd){await this.writer.write(new TextEncoder().encode(cmd+"\n"))}
  flush(){this.lines.length=0}
  // wait for a line starting with prefix; lines starting with ERR reject
  async expect(prefix,ms){const end=Date.now()+ms;
    for(;;){while(this.lines.length){const l=this.lines.shift();if(l.startsWith(prefix))return l;if(l.startsWith("ERR"))throw new Error("เครื่องตอบ: "+l)}
      const left=end-Date.now();if(left<=0)throw new Error("ไม่มีคำตอบ "+prefix+" จากเครื่อง");if(this.closed)throw new Error("ขาดการเชื่อมต่อ USB");
      await new Promise(r=>{const t=setTimeout(r,left);this.waiters.push(()=>{clearTimeout(t);r()})})}}
  async ping(){for(let i=0;i<5;i++){this.flush();await this.send("PING");try{return await this.expect("PONG",1500)}catch{}}throw new Error("เครื่องไม่ตอบ PING — ตรวจสาย USB (ต้องเป็นสายข้อมูล) และว่าอัปโหลดเฟิร์มแวร์แล้ว")}
  async close(){try{await this.reader.cancel()}catch{}try{this.writer.releaseLock()}catch{}try{await this.port.close()}catch{}}
}
let link=null;
const loadInstall=guard(async()=>{
  if(role!=="admin"){$("#main").innerHTML='<div class="warn">เฉพาะผู้ดูแลระบบ</div>';return}
  const [st,ds]=await Promise.all([api("/provision/status"),api("/devices")]);if(page!=="install")return;
  const next="SOS-"+String(1+Math.max(0,...ds.map(d=>+((d.label||"").match(/^SOS-(\d+)$/)||[0,0])[1]))).padStart(3,"0");
  const supported=SerialLink.supported();
  $("#main").innerHTML=`<div class="card"><h3>ติดตั้งอุปกรณ์ใหม่ผ่าน USB</h3>
   ${st.configured?"":'<div class="warn">ยังไม่ได้ตั้ง ChirpStack API key / Device profile ใน .env ของเซิร์ฟเวอร์ (CHIRPSTACK_API_KEY, CHIRPSTACK_PROFILE_ID) — ดู docs/INSTALL-4</div>'}
   ${supported?"":'<div class="warn">เบราว์เซอร์นี้ไม่รองรับ Web Serial — ใช้ Chrome หรือ Edge บนคอมพิวเตอร์ (ต้องเปิดผ่าน https)</div>'}
   <ol><li>เสียบเครื่อง Heltec ด้วยสาย USB (สายข้อมูล) เข้าคอมพิวเตอร์เครื่องนี้ ซึ่งอัปโหลดเฟิร์มแวร์แล้ว</li><li>ตั้งป้ายชื่อ กด "เริ่มติดตั้ง" แล้วเลือกพอร์ตของเครื่องในหน้าต่างที่เด้งขึ้น</li><li>รอจนครบทุกขั้นตอน แล้วพิมพ์ป้าย QR ติดกล่อง</li></ol>
   <div class="row">ป้ายชื่อเครื่อง <input id="plbl" value="${next}" maxlength="64"><button class="btn p" id="pgo" ${st.configured&&supported?"":"disabled"}>เริ่มติดตั้ง</button></div>
   <div id="psteps"></div><div id="pres"></div></div>
   <p class="mut">คีย์ลับ (AppKey) สร้างที่เซิร์ฟเวอร์ ส่งให้หน้านี้ผ่าน HTTPS ครั้งเดียวเพื่อเขียนลงเครื่องผ่าน USB เท่านั้น ไม่เก็บในแดชบอร์ด ไม่แสดงบนจอ และไม่อยู่ใน audit log</p>`;
  if(!$("#pgo"))return;
  $("#pgo").onclick=async()=>{
    const label=$("#plbl").value.trim();if(!label){toast("ใส่ป้ายชื่อก่อน");return}
    $("#pgo").disabled=true;$("#pres").innerHTML="";
    const steps=[["usb","เชื่อมต่อ USB และตรวจเครื่อง"],["reg","ลงทะเบียนในระบบ (ChirpStack + แดชบอร์ด)"],["flash","เขียนคีย์ลงเครื่อง"],["verify","อ่านค่ากลับมายืนยัน"],["join","รอเครื่องเชื่อมต่อเครือข่าย (ข้ามได้ถ้ายังไม่มี gateway)"]];
    const mark=(k,cls,msg)=>{const e=document.getElementById("st-"+k);if(e)e.innerHTML=`<span class="${cls}">${cls==="ok"?"✔":cls==="bad"?"✘":"…"}</span> ${steps.find(x=>x[0]===k)[1]}${msg?` <span class="mut">${esc(msg)}</span>`:""}`};
    $("#psteps").innerHTML=steps.map(([k])=>`<div class="step" id="st-${k}"><span class="mut">○</span> ${steps.find(x=>x[0]===k)[1]}</div>`).join("");
    let reg=null,cur="usb";
    try{
      link=new SerialLink();await link.open();mark("usb","wait");await new Promise(r=>setTimeout(r,1500));await link.ping();mark("usb","ok","ตอบ PONG");
      cur="reg";mark("reg","wait");reg=await api("/provision/start",{method:"POST",body:{label}});mark("reg","ok",reg.dev_eui);
      cur="flash";mark("flash","wait");link.flush();await link.send(`PROV ${reg.dev_eui} ${reg.app_key} ${reg.join_eui}`);await link.expect("OK",6000);reg.app_key=null;mark("flash","ok","เครื่องกำลังรีสตาร์ท");
      cur="verify";mark("verify","wait");await new Promise(r=>setTimeout(r,3000));let info=null;
      for(let i=0;i<6&&!info;i++){link.flush();await link.send("INFO");try{info=await link.expect("INFO",2500)}catch{}}
      if(!info)throw new Error("อ่านค่ากลับไม่ได้");
      if(!info.includes("deveui="+reg.dev_eui)||!info.includes("provisioned=1"))throw new Error("ค่าที่อ่านกลับไม่ตรง: "+info);
      await api(`/provision/${reg.dev_eui}/confirm`,{method:"POST",body:{info}});mark("verify","ok",info);cur="label";
      await link.close();link=null;
      const svg=await (await fetch(`/api/provision/${reg.dev_eui}/label.svg`,{headers:{authorization:"Bearer "+token}})).text();
      $("#pres").innerHTML=`<div class="card"><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:240px"><b class="ok">ติดตั้งสำเร็จ</b><br>ถอดสาย USB แล้วจ่ายไฟเครื่อง (ถ้าเครื่องอยู่ในระยะ gateway จะเชื่อมต่อเอง) จากนั้นไปที่หน้า "อุปกรณ์" เพื่อผูกผู้ป่วยและตั้งเป็น active</div>
        <div id="plabel" style="display:inline-block;margin:8px;padding:8px;border:1px dashed var(--bd);width:220px"><div style="width:120px">${svg.replace(/<\?xml[^>]*>/,"")}</div><div><b>${esc(label)}</b></div><div style="font:12px monospace">${reg.dev_eui}</div></div></div>
        <div class="row"><button class="btn" id="pprint">🖨 พิมพ์ป้าย</button><button class="btn" id="pnext">ติดตั้งเครื่องถัดไป</button></div></div>`;
      $("#pprint").onclick=()=>window.print();$("#pnext").onclick=()=>loadInstall();
      cur="join";mark("join","wait","กำลังรอ… จ่ายไฟเครื่องแล้วรอสักครู่");
      const end=Date.now()+180000;let seen=null;
      while(Date.now()<end&&page==="install"&&!seen){await new Promise(r=>setTimeout(r,5000));const l=await api("/devices");const d=l.find(x=>x.dev_eui===reg.dev_eui);if(d&&d.last_seen)seen=d}
      if(seen)mark("join","ok",`เห็นเครื่องแล้ว RSSI ${seen.rssi??"-"} dBm`);else{const e=document.getElementById("st-join");if(e)e.innerHTML='<span class="mut">○</span> ยังไม่เห็นเครื่อง — ไม่เป็นไร ให้ตรวจที่หน้า "อุปกรณ์" ภายหลัง (ตรวจว่า gateway ออนไลน์)'}
    }catch(e){
      mark(cur,"bad",e.message);
      if(link){await link.close();link=null}
      if(reg&&cur!=="join"&&cur!=="label"){try{await api(`/provision/${reg.dev_eui}/abort`,{method:"POST"});toast("ติดตั้งไม่สำเร็จ ยกเลิกการลงทะเบียนแล้ว ลองใหม่ได้")}catch(x){toast("ยกเลิกการลงทะเบียนไม่สำเร็จ: ลบเครื่อง "+reg.dev_eui+" เองในหน้าอุปกรณ์/ChirpStack")}}
      else toast(e.message);
      $("#pgo").disabled=false}
  }});

render();
