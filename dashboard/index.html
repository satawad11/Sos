<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c5fd5">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes">

<title>ระบบแจ้งเหตุฉุกเฉิน รพ.สต.</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mut:#6b7885;--red:#c62828;--grn:#2e7d32;--amb:#ef6c00;--bd:#dde3e8;--pri:#1565c0}
:root:where([data-theme=dark]){--bg:#10161c;--card:#1a232c;--ink:#e6edf3;--mut:#93a1ad;--bd:#2c3a46}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}
nav button,.btn{border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--bd)}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.g{background:var(--grn);color:#fff;border-color:var(--grn)}.btn.r{background:var(--red);color:#fff;border-color:var(--red)}
main{padding:16px;min-width:0}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.new{background:var(--red);color:#fff;border-color:var(--red)}.accepted{background:var(--amb);color:#fff;border-color:var(--amb)}.closed{background:var(--grn);color:#fff;border-color:var(--grn)}
.alarm{border:3px solid var(--red);animation:b 1s infinite}@keyframes b{50%{background:#c6282833}}
input,select,textarea{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.mut{color:var(--mut)}
#toast{position:fixed;z-index:60;max-width:92vw;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;display:none}
.warn{background:#fff3cd;color:#664d03;padding:8px 12px;border-radius:8px}
@media print{body.rpt *{visibility:hidden}body.rpt #rpt,body.rpt #rpt *{visibility:visible}body.rpt #rpt{position:absolute;left:0;top:0;width:100%;color:#000}body *{visibility:hidden}#plabel,#plabel *{visibility:visible}#plabel{position:absolute;left:0;top:0;border:1px solid #000;padding:6px;width:60mm;color:#000;background:#fff}}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ---------- app shell: sidebar on desktop, drawer on tablet/phone ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"top top" "side main";min-height:100vh;min-height:100dvh}
.top{grid-area:top;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(90deg,#0d47a1,var(--pri));color:#fff;box-shadow:0 2px 8px #0002}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;flex:1;min-width:0}.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ham{display:none;background:#ffffff26;border:0;color:#fff;font-size:22px;width:42px;height:42px;border-radius:10px;cursor:pointer}
.top .btn{background:#ffffff26;color:#fff;border-color:transparent}.top .btn.on{background:#fff;color:var(--pri)}
#side{grid-area:side;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);height:calc(100dvh - 62px);overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:12px 10px;background:var(--card);border-right:1px solid var(--bd)}
#side nav{display:flex;flex-direction:column;gap:2px}
#side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
#side nav button:hover{background:var(--bg)}#side nav button.on{background:var(--pri);color:#fff;font-weight:600}
#side .ic{width:24px;text-align:center;font-size:18px}
.me{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--bd)}.me b{display:block;overflow:hidden;text-overflow:ellipsis}.me .row{flex-wrap:nowrap}.me .row .btn{flex:1;white-space:nowrap;padding:8px 10px}
.scrim{display:none}
main>.card:first-child{margin-top:0}main{max-width:none;width:100%}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}.tw>table{min-width:560px}
.btn,nav button{min-height:40px}
@media(max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
  .ham{display:inline-flex;align-items:center;justify-content:center}
  #side{position:fixed;top:0;left:0;bottom:0;z-index:50;width:min(300px,86vw);height:100%;transform:translateX(-105%);visibility:hidden;transition:transform .22s ease,visibility .22s;padding-top:calc(16px + env(safe-area-inset-top))}
  .shell.nav-open #side{transform:none;visibility:visible;box-shadow:4px 0 24px #0004}
  .shell.nav-open .scrim{display:block;position:fixed;inset:0;z-index:40;background:#0006}
}
@media(max-width:640px){
  main{padding:10px}.card{padding:12px;border-radius:10px}.brand{font-size:16px}.top .btn .lbl{display:none}
  .row>input,.row>select,.row>textarea{flex:1 1 100%}h2{font-size:20px}h3{font-size:17px}
}

/* ================= premium design layer (overrides the base styles above) ================= */
@font-face{font-family:"Plex Thai";font-weight:400;font-display:swap;src:url(fonts/plex-thai-thai-400.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Plex Thai";font-weight:400;font-display:swap;src:url(fonts/plex-thai-latin-400.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Plex Thai";font-weight:600;font-display:swap;src:url(fonts/plex-thai-thai-600.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Plex Thai";font-weight:600;font-display:swap;src:url(fonts/plex-thai-latin-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Plex Thai";font-weight:700;font-display:swap;src:url(fonts/plex-thai-thai-700.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Plex Thai";font-weight:700;font-display:swap;src:url(fonts/plex-thai-latin-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f1b2d;--mut:#64748b;--bd:#e4e9f0;--pri:#1d4ed8;--pri3:#4338ca;--red:#dc2626;--grn:#16a34a;--amb:#d97706;
  --soft:#f1f5f9;--sh:0 1px 2px #0f172a0a,0 6px 20px #0f172a0d;--sh2:0 10px 30px #0f172a1f;--r:16px}
:root:where([data-theme=dark]){--bg:#0b1220;--card:#111a2b;--ink:#e6ecf5;--mut:#94a3b8;--bd:#1f2b40;--soft:#16213a;--sh:0 1px 2px #0006,0 6px 20px #0005;--sh2:0 10px 30px #0008}
body{font-family:"Plex Thai",system-ui,"Noto Sans Thai","Leelawadee UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.1px}
a{color:var(--pri);text-underline-offset:3px}:where(html[data-theme=dark]) a{color:#93b4ff}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em;background:var(--soft);padding:1px 6px;border-radius:6px}
.card{border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:700}.card h2{margin:0 0 10px}
.btn{border-radius:10px;font-weight:600;transition:transform .12s,box-shadow .12s,background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:#c7d2e0;box-shadow:0 2px 8px #0f172a14}.btn:active:not(:disabled){transform:translateY(1px)}
.btn.p{background:linear-gradient(135deg,var(--pri),var(--pri3));border:0;box-shadow:0 4px 14px #1d4ed840}.btn.p:hover:not(:disabled){box-shadow:0 6px 18px #1d4ed855}
.btn.g{background:linear-gradient(135deg,#16a34a,#15803d);border:0;box-shadow:0 4px 14px #16a34a40}.btn.r{background:linear-gradient(135deg,#ef4444,#b91c1c);border:0;box-shadow:0 4px 14px #dc262640}
input,select,textarea{border-radius:10px;padding:9px 12px;border:1.5px solid var(--bd);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px #1d4ed826}
th{font-size:12.5px;letter-spacing:.3px;color:var(--mut);background:var(--soft);position:sticky;top:0}th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
td{border-bottom:1px solid var(--bd)}tr:hover td{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.tag{border:0;font-weight:600;padding:3px 10px;background:var(--soft);color:var(--mut)}
.tag.new{background:var(--red);color:#fff;box-shadow:0 0 0 0 #dc262688;animation:ping 1.6s infinite}.tag.accepted{background:#fef3c7;color:#92400e}.tag.closed{background:#dcfce7;color:#166534}
:where(html[data-theme=dark]) .tag.accepted{background:#78350f;color:#fde68a}:where(html[data-theme=dark]) .tag.closed{background:#14532d;color:#bbf7d0}
@keyframes ping{70%{box-shadow:0 0 0 8px #dc262600}100%{box-shadow:0 0 0 0 #dc262600}}
.warn{border-radius:12px;padding:12px 14px;border:1px solid #fde68a;background:#fffbeb;color:#92400e;margin-bottom:14px}
:where(html[data-theme=dark]) .warn{background:#2a1f05;border-color:#5c4410;color:#fcd34d}
#toast{background:#0f172aee;backdrop-filter:blur(8px);border-radius:14px;box-shadow:var(--sh2);padding:12px 20px;font-weight:500}
.top{background:linear-gradient(100deg,#0b1f4d 0%,#1e3a8a 45%,#1d4ed8 100%);box-shadow:0 6px 24px #0b1f4d40}
#side{background:var(--card)}#side nav button{font-weight:500;color:var(--ink)}#side nav button .ic{filter:saturate(.9)}
#side nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri3));box-shadow:0 6px 16px #1d4ed840}
.alarm{animation:none;border:2px solid var(--red);box-shadow:0 0 0 4px #dc26261f,var(--sh)}
/* page header */
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 16px}
.ph h1{margin:0;font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.phr{display:flex;gap:8px;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-size:13px;color:var(--mut);font-weight:500}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}.sdot.on{background:var(--grn);box-shadow:0 0 0 3px #16a34a33}.sdot.off{background:var(--red);box-shadow:0 0 0 3px #dc262633}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
.kpi::after{content:"";position:absolute;inset:auto -30px -40px auto;width:110px;height:110px;border-radius:50%;background:var(--kc,#1d4ed8);opacity:.07}
.ki{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--kc,#1d4ed8) 14%,transparent)}
.kv small{font-size:14px;font-weight:600;color:var(--mut);margin-left:3px}.kl{font-size:13px;color:var(--mut);font-weight:500}.kv{font-size:28px;font-weight:700;line-height:1.15}.ks{font-size:12px;color:var(--mut)}
.kpi.red{--kc:#dc2626}.kpi.red .kv{color:var(--red)}.kpi.amb{--kc:#d97706}.kpi.grn{--kc:#16a34a}.kpi.ind{--kc:#4338ca}
/* open-case alert cards */
.acs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ac{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--bd);border-left:6px solid var(--amb);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.ac.new{border-left-color:var(--red);box-shadow:0 0 0 3px #dc26261a,var(--sh)}
.ach{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut)}
.acn{font-size:18px;font-weight:700;margin:8px 0 2px}.ac .row{margin-top:10px}.ac .row .btn{flex:1;text-align:center;text-decoration:none}
.empty{text-align:center;padding:26px 10px}.empty .big{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#dcfce7}
.empty h4{margin:4px 0;font-size:18px}
:where(html[data-theme=dark]) .empty .big{background:#14532d}
@media(max-width:640px){.ph h1{font-size:20px}.kv{font-size:24px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:12px;gap:10px}.ki{width:38px;height:38px;font-size:18px}}
/* ---------- sign-in / password screens ---------- */
.orgf{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 14px}.orgf .fld input{font-size:15px;padding:9px 12px}
.logo{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-right:18px}.lbox{width:96px;height:96px;border:1.5px dashed var(--bd);border-radius:12px;display:grid;place-items:center;background:var(--soft);overflow:hidden}.lbox img{max-width:100%;max-height:100%}

#mapc.picking{cursor:crosshair}.btn.sm{padding:6px 10px;min-height:0;font-size:13px}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px #0006;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.pin span{transform:rotate(45deg)}.pin.sm{width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:-2px;box-shadow:0 1px 2px #0005}
.pin.red{background:#dc2626}.pin.amb{background:#d97706}.pin.grn{background:#16a34a}.pin.gry{background:#94a3b8}.pin.blu{background:#3b82f6}.pin.pulse{animation:ping 1.4s infinite}
.leaflet-popup-content{margin:12px 14px;font:14px/1.5 "Plex Thai",system-ui,sans-serif}.leaflet-container{font-family:"Plex Thai",system-ui,sans-serif}

.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px;min-width:120px}.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grn),#22c55e)}

.auth-card.wide{max-width:480px}.shield{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#1d4ed8,#4338ca);box-shadow:0 8px 20px #1d4ed844}.shield.ok{background:linear-gradient(135deg,#16a34a,#15803d)}
.fld input.otp{text-align:center;font-size:28px;letter-spacing:12px;font-weight:700;font-variant-numeric:tabular-nums}
.steps{padding-left:20px;margin:0 0 14px}.steps li{margin:0 0 10px}.qr{background:#fff;border-radius:12px;padding:8px;width:180px;margin:10px auto 6px;box-shadow:var(--sh)}.qr svg{width:100%;height:auto;display:block}
.totpsec{display:block;text-align:center;font-size:15px;letter-spacing:1px;padding:8px;margin-top:6px;word-break:break-all}
.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 14px}.codes code{text-align:center;font-size:16px;padding:8px;letter-spacing:1px}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer;margin:4px 0 8px}.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .sl{flex:none;width:48px;height:28px;border-radius:99px;background:var(--bd);position:relative;transition:background .2s}.sw .sl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .2s}
.sw input:checked+.sl{background:var(--grn)}.sw input:checked+.sl::after{transform:translateX(20px)}.sw input:focus-visible+.sl{box-shadow:0 0 0 4px #1d4ed833}

.auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 600px at 10% -10%,#42a5f5 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#c62828 0,transparent 55%),linear-gradient(135deg,#0d47a1,#1565c0 55%,#283593)}
.auth-card{width:100%;max-width:410px;background:var(--card);color:var(--ink);border-radius:20px;padding:32px 28px 24px;box-shadow:0 20px 60px #0005;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.auth-logo{display:flex;justify-content:center;margin-bottom:10px}
.auth-card h1{font-size:23px;text-align:center;margin:4px 0 2px}.auth-card .sub{text-align:center;color:var(--mut);margin:0 0 22px;font-size:14px}
.fld{display:block;margin:0 0 14px}.fld>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.fld input{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);transition:border-color .15s,box-shadow .15s}
.fld input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px #1565c033}
.pwbox{position:relative}.pwbox input{padding-right:52px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mut);width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:18px}.eye:hover{background:var(--bd)}
.btn.big{width:100%;padding:13px;font-size:17px;font-weight:600;border-radius:12px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.auth .err{background:#fdecea;color:#8b1a1a;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.auth .caps{color:var(--amb);font-size:13px;margin:-8px 0 12px}
.auth .foot{text-align:center;color:var(--mut);font-size:12px;margin:18px 0 0}
.auth .alt{display:flex;gap:8px}.auth .alt .btn{flex:1}
.spin{width:18px;height:18px;border:2.5px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
:where(html[data-theme=dark]) .auth .err{background:#4a1515;color:#ffd6d6}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.step{display:flex;gap:8px;align-items:flex-start;margin:4px 0}.ok{color:var(--grn)}.bad{color:var(--red)}
:root{--pri2:#e3edfb;--red2:#fde8e8;--grn2:#e1f4e3;--amb2:#fff1d6;--sh:0 1px 2px #1018280d,0 4px 16px #1018280a;--r:14px}:root:where([data-theme=dark]){--pri2:#16304f;--red2:#3b1a1f;--grn2:#12301f;--amb2:#33270c;--sh:0 1px 2px #0006}

/* settings */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;width:max-content;max-width:100%;overflow-x:auto}
.pills button{border:0;background:transparent;color:var(--mut);font:inherit;padding:8px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pills button.on{background:var(--pri);color:#fff;font-weight:600}.pills .dot{width:7px;height:7px;border-radius:50%;background:var(--amb);display:none}.pills .dirty .dot{display:inline-block}
.sec[hidden]{display:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.chead .ci svg.i{width:20px;height:20px}
.chead{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}.chead .ci{width:36px;height:36px;border-radius:10px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;flex:none}
.chead p{margin:2px 0 0;color:var(--mut);font-size:13px}
.sf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px 24px;padding:14px 0;border-top:1px solid var(--bd);align-items:center}
.sf:first-of-type{border-top:0}.fl label{font-weight:600;display:block}.fl p{margin:2px 0 0;color:var(--mut);font-size:13px}
.inp{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:10px;background:var(--card);overflow:hidden}
.inp:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}.inp input{border:0;box-shadow:none!important;width:92px;text-align:right}
.inp span{padding:0 12px;color:var(--mut);background:var(--bg);align-self:stretch;display:flex;align-items:center;font-size:13px;border-left:1px solid var(--bd)}
.inp.bad3{border-color:var(--red)}
.hint{color:var(--mut);font-size:12.5px;margin:6px 0 0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--pri);color:var(--pri)}
.chip{position:relative;display:inline-block}.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-block;padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;user-select:none;min-width:44px;text-align:center}
.chip input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}.chip input:focus-visible+span{box-shadow:0 0 0 3px var(--pri2)}
.chip input:disabled+span{opacity:.6;cursor:not-allowed}
.sw{display:inline-flex;gap:10px;align-items:center;cursor:pointer}.sw input{position:absolute;opacity:0}
.sw i{width:42px;height:24px;border-radius:99px;background:var(--bd);position:relative;transition:background .2s;flex:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0004}
.sw input:checked+i{background:var(--grn)}.sw input:checked+i:after{transform:translateX(18px)}.sw input:focus-visible+i{box-shadow:0 0 0 3px var(--pri2)}
.savebar{position:sticky;bottom:12px;z-index:20;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;box-shadow:0 10px 40px #0004;margin-top:14px}
.savebar[hidden]{display:none}.savebar b{font-weight:600}.savebar .btn{border-color:transparent}
.hol{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--bd)}.hol:first-of-type{border-top:0}.hol span:nth-child(2){flex:1}
@media(max-width:640px){.sf{grid-template-columns:1fr}.pills{flex-wrap:nowrap;width:100%}}
.warn.bad2{background:var(--red2);color:var(--red)}
.mk{box-sizing:border-box}.mk-gw{width:34px;height:34px;border-radius:10px;background:#fff;border:2px solid #16a34a;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px #0004}.mk-gw.off{border-color:#dc2626;background:#fee2e2}
.mk-dv{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0003,0 2px 6px #0004}.mk-dv.off{box-shadow:0 0 0 3px #dc2626}
.leaflet-tooltip.mk-tip{background:#fff;border:0;color:#111;font-weight:600;box-shadow:0 1px 4px #0003;padding:1px 6px;font-size:12px}.mk-tip:before{display:none}
.leaflet-popup-content{color:#16202e;font:14px/1.5 inherit}.leaflet-popup-content .mut{color:#64748b}
:where(html[data-theme=dark]) #mapc .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}

.lst-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0;font-size:13.5px;color:var(--mut)}
.lst-bar select,.lst-bar input{font:inherit;padding:4px 8px}.lst-bar .sp{flex:1}
.lst-pg{display:inline-flex;gap:4px;flex-wrap:wrap}.lst-pg button{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;min-width:34px;padding:4px 8px;font:inherit;cursor:pointer}
.lst-pg button.on{background:var(--pri);border-color:var(--pri);color:#fff}.lst-pg button:disabled{opacity:.4;cursor:default}
.lst-bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--pri) 12%,var(--card));border:1px solid color-mix(in srgb,var(--pri) 40%,var(--bd));color:var(--ink)}
.lst-bulk a{color:var(--pri);cursor:pointer;text-decoration:underline}
td.lck,th.lck{width:34px;padding-right:0}td.lck input,th.lck input{width:17px;height:17px;cursor:pointer}
tr.lsel td{background:color-mix(in srgb,var(--pri) 8%,transparent)}

/* ================= design v3 — pine / brass / signal red (overrides everything above) ================= */
@font-face{font-family:"Serif Thai";font-weight:600;font-display:swap;src:url(fonts/serif-thai-thai-600.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Serif Thai";font-weight:600;font-display:swap;src:url(fonts/serif-thai-latin-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
:root{--bg:#edf0ee;--card:#fff;--ink:#17201e;--mut:#5e6b67;--bd:#d8dfdb;--soft:#f4f6f5;--line:#c5cec9;
  --pri:#1f6f5c;--pri3:#1f6f5c;--pri2:#dcebe4;--pine:#12302c;--pine2:#1a3d38;--brass:#a8834a;--brass2:#d6b47c;
  --red:#c62f2f;--red2:#fbe9e7;--amb:#b7791f;--amb2:#f6ecd6;--grn:#2f7d4f;--grn2:#e0efe5;
  --sh:none;--sh2:0 18px 50px #0b1a1733;--r:12px;--serif:"Serif Thai","Noto Serif Thai","Plex Thai",serif}
:root:where([data-theme=dark]){--bg:#0c1513;--card:#121e1b;--ink:#e4ebe8;--mut:#8fa19b;--bd:#22332f;--soft:#162420;--line:#2c403b;
  --pri:#2f8a72;--pri3:#2f8a72;--pri2:#173a31;--pine:#0a1a17;--pine2:#11241f;--red:#e0524f;--red2:#3a1918;--amb:#d69a3a;--amb2:#33270f;--grn:#4fa673;--grn2:#132e1f;--sh2:0 18px 50px #0008}
body{background:var(--bg);color:var(--ink);letter-spacing:0}
h1,h2,h3,h4,.acn,.kv,.pt{font-family:var(--serif);font-weight:600;letter-spacing:0}
a{color:var(--pri)}
::selection{background:var(--brass2);color:#17201e}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* buttons & inputs */
.btn,nav button{min-height:38px}
.btn{border-radius:8px;font-weight:600;background:var(--card);border:1px solid var(--line);box-shadow:none;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--ink);box-shadow:none}
.btn.p,.btn.p:hover:not(:disabled){background:var(--pri);border:1px solid var(--pri);color:#fff;box-shadow:none}
.btn.p:hover:not(:disabled){background:color-mix(in srgb,var(--pri) 86%,#000)}
.btn.g{background:var(--grn);border:1px solid var(--grn);color:#fff;box-shadow:none}
.btn.r{background:var(--red);border:1px solid var(--red);color:#fff;box-shadow:none}
.btn.sm{border-radius:6px}
input,select,textarea{border-radius:8px;border:1px solid var(--line);background:var(--card)}
input:focus,select:focus,textarea:focus,.fld input:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:none;padding:20px 22px}
.card h3{font-size:18px;margin:0 0 14px}
table th{background:transparent;color:var(--mut);font-size:13px;font-weight:600;letter-spacing:0;border-bottom:1px solid var(--line);padding:10px}
table td{padding:11px 10px;border-bottom:1px solid var(--bd)}
th:first-child,th:last-child{border-radius:0}
tr:hover td{background:color-mix(in srgb,var(--pri) 4%,transparent)}
.tag{border-radius:6px;padding:2px 9px;font-weight:600;background:var(--soft);color:var(--mut)}
.tag.new{background:var(--red);color:#fff}
.tag.accepted{background:var(--amb2);color:color-mix(in srgb,var(--amb) 70%,var(--ink))}
.tag.closed{background:var(--grn2);color:var(--grn)}
.warn{border-radius:10px;background:var(--amb2);border:1px solid color-mix(in srgb,var(--amb) 35%,transparent);color:color-mix(in srgb,var(--amb) 60%,var(--ink))}
#toast{background:var(--pine);color:#eef3f1;border-radius:10px;border:1px solid #ffffff1a}
.savebar{background:var(--pine);color:#eef3f1;border-radius:12px}
.pills{border-radius:10px;box-shadow:none}.pills button{border-radius:7px}.pills button.on{background:var(--pine);color:#fff}
.chip input:checked+span{background:var(--pri);border-color:var(--pri)}
.chead .ci{background:var(--pri2);color:var(--pri);border-radius:8px}
.hchip{background:transparent;box-shadow:none;border:1px solid var(--bd);color:var(--mut);font-size:13px;padding:5px 11px;border-radius:99px}
.hchip.tm{font-variant-numeric:tabular-nums}
.sdot.on{background:var(--grn);box-shadow:0 0 0 3px color-mix(in srgb,var(--grn) 25%,transparent)}

/* KPI strip: one panel with hairline dividers */
.kpis{gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px}
.kpi{background:var(--card);border:0;border-radius:0;box-shadow:none;padding:18px 22px;display:block}
.kpi::after,.ki{display:none}
.kl{font-size:13.5px;color:var(--mut);font-weight:500}
.kv{font-size:36px;line-height:1.2;margin:4px 0 2px;font-variant-numeric:tabular-nums lining-nums}
.kv small{font-family:"Plex Thai",system-ui,sans-serif;font-size:14px}
.kpi.red{box-shadow:inset 0 3px 0 var(--red)}.kpi.red .kv{color:var(--red)}
.kpi.grn .kv{color:var(--ink)}.kpi.amb .kv{color:var(--amb)}
.bar span{background:var(--pri)}

/* open cases */
.alarm{border:1px solid var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 14%,transparent)}
.ac{border-radius:10px;border:1px solid var(--bd);border-left:4px solid var(--amb);box-shadow:none;padding:14px 16px 16px}
.ac.new{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 4%,var(--card));box-shadow:none}
.acn{font-size:21px;margin:10px 0 2px}
.empty{padding:34px 10px}.empty .big{font-size:0;width:56px;height:56px;background:var(--grn2);position:relative}
.empty .big::after{content:"";position:absolute;left:20px;top:14px;width:12px;height:22px;border:solid var(--grn);border-width:0 3px 3px 0;transform:rotate(45deg)}
.empty h4{font-size:20px}

/* app shell */
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);box-shadow:none;border-bottom:1px solid var(--bd);padding:12px 28px;padding-top:calc(12px + env(safe-area-inset-top));gap:12px}
.pt{flex:1;min-width:0;margin:0;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phr{display:flex;gap:8px;align-items:center}
.top .btn.snd{background:var(--card);color:var(--ink);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.top .btn.snd.on{background:var(--pri2);color:var(--pri);border-color:color-mix(in srgb,var(--pri) 40%,transparent)}
.ham{background:var(--card);color:var(--ink);border:1px solid var(--line);width:40px;height:40px;border-radius:8px}
#side{background:var(--pine);color:#d5e0dc;border-right:0;padding:0 12px 12px;gap:0}
.sbrand{display:flex;gap:12px;align-items:center;padding:20px 8px 18px;margin-bottom:6px;border-bottom:1px solid #ffffff14}
.sbrand b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;color:#fff;line-height:1.3}
.sbrand span{font-size:12.5px;color:#93aca4}
.ng{font-size:12.5px;color:var(--brass2);opacity:.8;padding:16px 12px 6px}
#side nav{gap:1px}
#side nav button{color:#c9d6d1;font-weight:500;padding:9px 12px;border-radius:7px;gap:12px}
#side nav button svg.i{width:18px;height:18px;stroke-width:1.7;color:#7fa196}
#side nav button:hover{background:#ffffff0d;color:#fff}
#side nav button.on{background:#ffffff14;color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--brass2)}
#side nav button.on svg.i{color:var(--brass2)}
.me{border-top:1px solid #ffffff14;padding:14px 6px 2px;margin-top:auto}
.who{display:flex;gap:10px;align-items:center;margin-bottom:10px}.who b{color:#fff;font-weight:600}.who span:not(.av){font-size:12.5px;color:#93aca4;display:block}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--brass);color:#fff;font-weight:700;font-size:15px}
.me .btn{background:transparent;color:#dce6e2;border:1px solid #ffffff2b;font-weight:500}.me .btn:hover:not(:disabled){border-color:#ffffff66;background:#ffffff0d}
main{padding:24px 28px 40px;max-width:none}
@media(min-width:1024px){
  .shell{grid-template-columns:260px minmax(0,1fr);grid-template-areas:"side top" "side main"}
  #side{grid-row:1/3;position:sticky;top:0;height:100vh;height:100dvh}
}
@media(max-width:1023px){
  .shell.nav-open #side{box-shadow:8px 0 40px #0006}
  #side{padding-top:env(safe-area-inset-top)}
  .top{padding-left:14px;padding-right:14px}
}
@media(max-width:640px){
  main{padding:14px 12px 32px}.card{padding:16px}.pt{font-size:20px}
  .hchip.tm,#conn{display:none}.top .btn.snd .lbl{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:14px}.kv{font-size:28px}
}

/* sign-in: pine field with brass radio rings from the button */
.auth{position:relative;overflow:hidden;background:var(--pine);gap:56px;padding:32px 20px}
.auth::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 22% 46%,transparent 0 38px,color-mix(in srgb,var(--brass2) 22%,transparent) 38px 39px);
  -webkit-mask-image:radial-gradient(circle at 22% 46%,#000 0,#000 18%,transparent 62%);mask-image:radial-gradient(circle at 22% 46%,#000 0,#000 18%,transparent 62%)}
.auth>*{position:relative}
.auth-side{max-width:400px;color:#e7efec}
.auth-side h2{font-size:40px;line-height:1.25;margin:22px 0 12px;color:#fff}
.auth-side p{color:#a9bfb7;font-size:16px;line-height:1.7;margin:0;max-width:34ch}
.auth-card{border-radius:14px;box-shadow:var(--sh2);padding:34px 30px 26px;border:1px solid #ffffff10}
.auth-card h1{font-size:26px}
.fld input{border-radius:8px;border:1px solid var(--line);background:var(--card)}
.btn.big{border-radius:8px}
.auth .err{background:var(--red2);color:var(--red);border-radius:8px}
.shield{border-radius:12px;background:var(--pine);box-shadow:none}.shield.ok{background:var(--grn)}
@media(min-width:900px){.auth .auth-logo{display:none}}
@media(max-width:899px){.auth{flex-direction:column;gap:22px;justify-content:flex-start;padding-top:calc(36px + env(safe-area-inset-top))}
  .auth::before{background:repeating-radial-gradient(circle at 50% 70px,transparent 0 34px,color-mix(in srgb,var(--brass2) 22%,transparent) 34px 35px);-webkit-mask-image:radial-gradient(circle at 50% 70px,#000 0,transparent 260px);mask-image:radial-gradient(circle at 50% 70px,#000 0,transparent 260px)}
  .auth-side{text-align:center}.auth-side h2{font-size:24px;margin:12px 0 0}.auth-side p{display:none}.auth .auth-logo{display:none}}

.tag{white-space:nowrap}
.btn svg.i{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.kpis{gap:0;background:var(--card)}
.kpi{box-shadow:-1px 0 0 var(--bd),0 -1px 0 var(--bd)}
.kpi.red{box-shadow:-1px 0 0 var(--bd),0 -1px 0 var(--bd),inset 0 3px 0 var(--red)}
#side nav button{padding:8px 12px}.ng{padding:14px 12px 5px}
td .btn{white-space:nowrap}.auth-side p{max-width:40ch}

/* update progress */
.upg{border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin:14px 0;background:var(--soft)}
.upg.ok{border-color:color-mix(in srgb,var(--grn) 40%,transparent);background:var(--grn2)}.upg.bad{border-color:color-mix(in srgb,var(--red) 40%,transparent);background:var(--red2)}
.upg-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}.upg-h b{font-family:var(--serif);font-weight:600;font-size:18px}.upg-h>span{color:var(--mut);font-variant-numeric:tabular-nums}
.upg-bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin:12px 0 14px}
.upg-bar span{display:block;height:100%;border-radius:99px;background:var(--pri);transition:width .9s cubic-bezier(.3,.7,.4,1)}
.upg.ok .upg-bar span{background:var(--grn)}.upg.bad .upg-bar span{background:var(--red)}
.upg-s{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.upg-s li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:13px;color:var(--mut)}
.upg-s i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card);position:relative}
.upg-s li.d{color:var(--ink)}.upg-s li.d i{background:var(--grn);border-color:var(--grn)}
.upg-s li.d i::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.upg-s li.a{color:var(--ink);font-weight:600}.upg-s li.a i{border-color:var(--pri);border-top-color:transparent;animation:sp 1s linear infinite}
.upg-s li.x{color:var(--red);font-weight:600}.upg-s li.x i{background:var(--red);border-color:var(--red)}
.upg-s li.x i::before,.upg-s li.x i::after{content:"";position:absolute;left:8px;top:3px;width:2px;height:12px;background:#fff;transform:rotate(45deg)}.upg-s li.x i::after{transform:rotate(-45deg)}
.upg-m{margin:14px 0 0;font-size:14px}
@media(max-width:640px){.upg-s{grid-template-columns:1fr;gap:8px}.upg-s li{flex-direction:row;text-align:left}}

/* ================= palette v4 — light, calm indigo (overrides v3) ================= */
:root{--bg:#f5f6fa;--card:#fff;--ink:#1e2433;--mut:#667085;--bd:#e6e8ef;--line:#d5d9e2;--soft:#f2f4f8;
  --pri:#4c5fd5;--pri3:#4c5fd5;--pri2:#eceefc;--pine:#1e2240;--brass:#4c5fd5;--brass2:#a5b0ff;
  --red:#d64545;--red2:#fdecec;--amb:#c27a12;--amb2:#fbf1de;--grn:#1e8e5e;--grn2:#e3f4ec;--sh2:0 18px 50px #1e224033;
  --serif:"Plex Thai",system-ui,"Noto Sans Thai",sans-serif}
:root:where([data-theme=dark]){--bg:#12141c;--card:#1a1d28;--ink:#e6e8f0;--mut:#9aa1b5;--bd:#282c3a;--line:#343949;--soft:#20232f;
  --pri:#6c7bef;--pri3:#6c7bef;--pri2:#262b4a;--pine:#161924;--red:#ef6b6b;--red2:#3a1d22;--amb:#e0a040;--amb2:#33280f;--grn:#3fb27f;--grn2:#15301f;--sh2:0 18px 50px #0008}
h1,h2,h3,h4,.acn,.kv,.pt,.upg-h b,.sbrand b{font-weight:700;letter-spacing:-.2px}
.kv{font-weight:600}
::selection{background:var(--pri2);color:var(--ink)}
:focus-visible{outline-color:var(--pri)}
#side{background:var(--card);color:var(--ink);border-right:1px solid var(--bd)}
.sbrand{border-bottom-color:var(--bd)}.sbrand b{color:var(--ink)}.sbrand span{color:var(--mut)}
.ng{color:var(--mut);opacity:1}
#side nav button{color:#3f4659}#side nav button svg.i{color:#8a91a5}
#side nav button:hover{background:var(--soft);color:var(--ink)}
#side nav button.on{background:var(--pri2);color:var(--pri);box-shadow:inset 3px 0 0 var(--pri)}#side nav button.on svg.i{color:var(--pri)}
:where(html[data-theme=dark]) #side nav button{color:#c3c8d8}:where(html[data-theme=dark]) #side nav button svg.i{color:#7d849a}
.me{border-top-color:var(--bd)}.who b{color:var(--ink)}.who span:not(.av){color:var(--mut)}.av{background:var(--pri)}
.me .btn{color:var(--ink);border-color:var(--line)}.me .btn:hover:not(:disabled){border-color:var(--ink);background:var(--soft)}
.top{background:color-mix(in srgb,var(--bg) 85%,transparent)}

    if(m.overdue&&m.state==="new")notify({id:`c${id}o`,kind:"warn",title:`เคส #${id} เกินเวลารับเรื่อง`,body:"ยังไม่มีผู้รับเรื่อง",go:{case:id}});

    toast(`ผู้ป่วยกดปุ่มซ้ำ (เคส #${id})`,"warn");if(audioOn&&!SND.timer)siren()}

function devNotify(m){const is=m.issue||"",k=Object.keys(DVI).find(k=>is.startsWith("device_"+k));if(!k)return;
  const ok=/_ok$/.test(is),rep=/_repeat$/.test(is),crit=/_critical$/.test(is),id=`d:${m.dev_eui}:${k}`,who=m.label||m.dev_eui;

// ---------------------------------------------------------------- live link (WebSocket)
// One connection at a time: every connect bumps wsGen, so callbacks of an older socket can never schedule another
// reconnect (that loop used to replace a healthy connection every 3 s and lose events in between).
// A ping every 25 s notices a dead link (sleeping laptop, Wi-Fi switch, proxy timeout); after a reconnect the open
// cases are re-read, so nothing that happened while offline is missed.
let wsGen=0,wsLast=0,wsDown=false;
function connectWS(){
  const gen=++wsGen;if(ws){ws.onopen=ws.onclose=ws.onmessage=null;try{ws.close()}catch(e){}}
  const s=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/ws?token="+encodeURIComponent(token));ws=s;
  s.onopen=()=>{if(gen!==wsGen)return;wsLast=Date.now();setConn(true);if(wsDown){wsDown=false;liveResync()}};
  s.onmessage=e=>{if(gen!==wsGen)return;wsLast=Date.now();let m;try{m=JSON.parse(e.data)}catch(_){return}if(m.type!=="pong")liveEvent(m)};
  s.onclose=()=>{if(gen!==wsGen)return;setConn(false);wsDown=true;if(token)setTimeout(()=>{if(gen===wsGen&&token)connectWS()},2000)}}
setInterval(()=>{if(!token||!ws)return;
  if(ws.readyState===1){if(Date.now()-wsLast>60000){wsDown=true;setConn(false);connectWS()}else try{ws.send("ping")}catch(e){}}},25000);
document.addEventListener("visibilitychange",()=>{if(document.hidden||!token)return;if(!ws||ws.readyState>1||Date.now()-wsLast>40000){wsDown=true;connectWS()}});
addEventListener("online",()=>{if(token){wsDown=true;connectWS()}});
// ---------------------------------------------------------------- button link badge (ok / late / offline / never)
// The server sends late_at / off_at; the badge moves on by itself as time passes and resets on every uplink (device_seen).
const LINK={ok:["ปกติ","lk-ok"],late:["เลยรอบ","lk-late"],offline:["ขาดการติดต่อ","lk-off"],never:["ยังไม่เคยส่ง","lk-never"]};
function linkNow(d){if(!d.last_seen||!d.late_at)return "never";const t=Date.now();return t<Date.parse(d.late_at)?"ok":t<Date.parse(d.off_at)?"late":"offline"}
function linkBadge(d){const [t,c]=LINK[linkNow(d)];
  return `<span class="lk ${c}" data-seen="${esc(d.last_seen||"")}" data-late="${esc(d.late_at||"")}" data-off="${esc(d.off_at||"")}" title="${d.hb_min?`รายงานทุก ${d.hb_min} นาที`:""}${d.last_seen?" · ส่งล่าสุด "+fmt(d.last_seen):""}"><i></i><span>${t}</span></span>`}
function linkRepaint(){document.querySelectorAll(".lk[data-late]").forEach(el=>{const [t,c]=LINK[linkNow({last_seen:el.dataset.seen,late_at:el.dataset.late,off_at:el.dataset.off})];
    if(!el.classList.contains(c)){el.className="lk "+c;el.querySelector("span").textContent=t}
    el.closest("tr")?.classList.toggle("stale",c!=="lk-ok")});
  document.querySelectorAll("[data-ago]").forEach(el=>{if(el.dataset.ago)el.textContent=ago(el.dataset.ago)})}

// ---------------------------------------------------------------- alarm sound
// One AudioContext, unlocked by the first click/tap/key on the page (browsers block sound before that).
// While any new case is unanswered the siren repeats every 3 s, until the case is accepted/closed or someone
// presses "หยุดเสียง 2 นาที". The on/off choice is remembered per browser (on by default).
const SND={ctx:null,timer:0,muteUntil:0,cases:new Set()};
function sndCtx(){if(!SND.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;try{SND.ctx=new A()}catch(e){return null}}return SND.ctx}
const sndReady=()=>SND.ctx?.state==="running";
function sndUnlock(){const c=sndCtx();if(c&&c.state!=="running")c.resume().then(()=>{sndUI();alarmSync()}).catch(()=>{})}
["pointerdown","keydown","touchend"].forEach(t=>document.addEventListener(t,sndUnlock,{capture:true,passive:true}));
function tones(seq,vol=.22){const c=sndCtx();if(!c||c.state!=="running")return false;let t=c.currentTime+.02;
  for(const [f,d] of seq){const o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.setValueAtTime(vol,t+d-.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);t+=d}return true}
const siren=()=>tones([[988,.28],[740,.28],[988,.28],[740,.28],[988,.28],[740,.28]],.28);
function beep(){if(audioOn)tones([[880,.12],[1175,.18]],.18)}            // short chime: sound switched on, test press
function alarmSet(ids){SND.cases=new Set(ids);alarmSync()}
function alarmAdd(id){SND.cases.add(+id);alarmSync()}
function alarmDrop(id){SND.cases.delete(+id);alarmSync()}
function alarmSync(){const ring=audioOn&&SND.cases.size>0&&Date.now()>=SND.muteUntil;
  if(ring&&!SND.timer){siren();SND.timer=setInterval(()=>{if(Date.now()<SND.muteUntil)return;siren()},3000)}
  else if(!ring&&SND.timer){clearInterval(SND.timer);SND.timer=0}
  if(SND.muteUntil&&Date.now()>=SND.muteUntil){SND.muteUntil=0}sndUI()}
function alarmMute(min=2){SND.muteUntil=Date.now()+min*60000;alarmSync();toast(`หยุดเสียงเตือน ${min} นาที เคสยังรอรับเรื่องอยู่`,"info");setTimeout(alarmSync,min*60000+200)}
function sndUI(){const b=$("#snd");if(!b)return;const ringing=audioOn&&SND.cases.size>0&&Date.now()>=SND.muteUntil,locked=audioOn&&!sndReady();
  const [ic,lbl,cls,tip]=!audioOn?["volx","เปิดเสียงเตือน","","เสียงเตือนปิดอยู่ — กดเพื่อเปิด"]
    :ringing?["vol","หยุดเสียง 2 นาที","ring","มีเคสใหม่รอรับเรื่อง — กดเพื่อหยุดเสียงชั่วคราว"]
    :locked?["volx","แตะเพื่อเปิดเสียง","lock","เบราว์เซอร์ยังไม่อนุญาตให้เล่นเสียง — คลิกที่ใดก็ได้บนหน้านี้หนึ่งครั้ง"]
    :SND.muteUntil>Date.now()?["volx",`หยุดเสียงถึง ${new Date(SND.muteUntil).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}`,"","กดเพื่อให้เสียงกลับมาดังทันที"]
    :["vol","เสียงเปิด","on","เสียงเตือนเปิดอยู่ — กดเพื่อปิด"];
  b.className="btn snd "+cls;b.title=tip;b.innerHTML=`${ico(ic)}<span class="lbl">${lbl}</span>`}
function sndClick(){sndUnlock();
  if(!audioOn){audioOn=true;lsSet("snd","1");setTimeout(()=>{beep();alarmSync()},60);return}
  if(SND.cases.size&&Date.now()>=SND.muteUntil){alarmMute(2);return}
  if(SND.muteUntil>Date.now()){SND.muteUntil=0;alarmSync();return}
  audioOn=false;lsSet("snd","0");alarmSync()}
setInterval(sndUI,30000);
function liveEvent(m){if(m.type==="device_seen"){devSeen(m);return}onEvt(m).catch(()=>{});if(m.type==="gateway_cmd"&&page==="gateways"&&window._gwDraw)window._gwDraw().catch(()=>{});if(m.type==="gateway_state"){if("maint" in m)toast(m.maint?"เกตเวย์เข้าโหมดซ่อมบำรุง":"เกตเวย์ออกจากโหมดซ่อมบำรุง","info");else toast(m.state==="offline"?"เกตเวย์ขาดการเชื่อมต่อ":"เกตเวย์กลับมาออนไลน์",m.state==="offline"?"warn":"ok");if(page==="gateways"&&!devEdit)loadGateways()}if(m.type==="case_test"){toast("ได้รับสัญญาณทดสอบปุ่ม","info");if(page==="selftest")loadSelftest()}if(page==="cases"){if(caseOpen){if(m.case_id===caseOpen&&(m.type==="case_msg"||m.type==="case_update"||m.type==="case_repeat")&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))showCase(caseOpen)}else loadCases()}if(page==="map"&&(m.type==="case_new"||m.type==="case_update"))loadMap()}

/* ---- shared list helper: paging (10/25/50/100 per page), quick search, multi-select + bulk actions ----
   lister(key, root, {bulk:[{label,cls,confirm(n),run(id),only(id)}], reload, noun})
   Rows need data-rid="<id>" for bulk. State (page, size, selection) survives the periodic re-render of a page. */
const LST={};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function lister(key,root,o={}){
  const table=root&&root.querySelector("table");if(!table||table.rows.length<2)return;
  const st=LST[key]||(LST[key]={page:0,size:+lsGet("lst_size")||10,sel:new Set(),q:""});
  const hasBulk=(o.bulk||[]).length>0&&canEdit(),noun=o.noun||"รายการ";
  const head=table.rows[0],rows=[...table.rows].slice(1);
  const ids=rows.map(r=>r.dataset.rid).filter(Boolean);st.sel=new Set([...st.sel].filter(i=>ids.includes(i)));
  if(hasBulk){const th=document.createElement("th");th.className="lck";th.innerHTML='<input type="checkbox" title="เลือกทั้งหน้า">';head.insertBefore(th,head.firstChild);
    rows.forEach(r=>{const td=document.createElement("td");td.className="lck";const id=r.dataset.rid;td.innerHTML=id?`<input type="checkbox" ${st.sel.has(id)?"checked":""}>`:"";r.insertBefore(td,r.firstChild);
      const cb=td.firstChild;if(cb)cb.onchange=()=>{cb.checked?st.sel.add(id):st.sel.delete(id);draw()}})}
  const bar=document.createElement("div"),bulk=document.createElement("div");bulk.className="lst-bulk";bulk.style.display="none";
  table.parentNode.insertBefore(bulk,table);table.parentNode.insertBefore(bar,table.nextSibling);bar.className="lst-bar";
  const match=r=>!st.q||r.textContent.toLowerCase().includes(st.q.toLowerCase());
  function draw(){
    const vis=rows.filter(match),size=st.size,pages=Math.max(1,Math.ceil(vis.length/size));if(st.page>=pages)st.page=pages-1;
    const from=st.page*size,cur=vis.slice(from,from+size);
    rows.forEach(r=>{r.style.display=cur.includes(r)?"":"none";r.classList.toggle("lsel",!!r.dataset.rid&&st.sel.has(r.dataset.rid))});
    if(hasBulk){rows.forEach(r=>{const cb=r.querySelector("td.lck input");if(cb)cb.checked=st.sel.has(r.dataset.rid)});
      const all=head.querySelector("th.lck input"),idc=cur.map(r=>r.dataset.rid).filter(Boolean);all.checked=idc.length>0&&idc.every(i=>st.sel.has(i));
      all.onchange=()=>{idc.forEach(i=>all.checked?st.sel.add(i):st.sel.delete(i));draw()}}
    const nb=[];for(let i=0;i<pages;i++)if(i===0||i===pages-1||Math.abs(i-st.page)<=2)nb.push(i);
    let pg="";nb.forEach((i,k)=>{if(k&&i-nb[k-1]>1)pg+="<span>…</span>";pg+=`<button data-pg="${i}" class="${i===st.page?"on":""}">${i+1}</button>`});
    bar.innerHTML=`<span>แสดง ${vis.length?from+1:0}–${from+cur.length} จาก ${vis.length}${vis.length!==rows.length?` (ทั้งหมด ${rows.length})`:""} ${noun}</span><span class="sp"></span>
      <input type="search" placeholder="ค้นหา…" value="${esc(st.q)}" style="width:150px" aria-label="ค้นหา">
      <label>ต่อหน้า <select>${[10,25,50,100].map(n=>`<option ${n===size?"selected":""}>${n}</option>`).join("")}</select></label>
      <span class="lst-pg"><button data-pg="${st.page-1}" ${st.page?"":"disabled"}>‹</button>${pg}<button data-pg="${st.page+1}" ${st.page<pages-1?"":"disabled"}>›</button></span>`;
    bar.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{st.page=+b.dataset.pg;draw()});
    bar.querySelector("select").onchange=e=>{st.size=+e.target.value;lsSet("lst_size",st.size);st.page=0;draw()};
    const q=bar.querySelector("input");q.oninput=()=>{st.q=q.value;st.page=0;const pos=q.selectionStart;draw();const n=bar.querySelector("input");n.focus();n.setSelectionRange(pos,pos)};
    if(hasBulk){const n=st.sel.size;bulk.style.display=n?"flex":"none";
      if(n){const vid=vis.map(r=>r.dataset.rid).filter(Boolean);
        bulk.innerHTML=`<b>เลือก ${n} ${noun}</b>${vid.length>n?`<a data-all>เลือกทั้งหมด ${vid.length} ${noun}</a>`:""}<span class="sp"></span>${o.bulk.map((b,i)=>`<button class="btn ${b.cls||""}" data-b="${i}">${b.label}</button>`).join("")}<a data-clr>ยกเลิกการเลือก</a>`;
        const al=bulk.querySelector("[data-all]");if(al)al.onclick=()=>{vid.forEach(i=>st.sel.add(i));draw()};
        bulk.querySelector("[data-clr]").onclick=()=>{st.sel.clear();draw()};
        bulk.querySelectorAll("[data-b]").forEach(bt=>bt.onclick=()=>runBulk(o.bulk[+bt.dataset.b]))}}}
  async function runBulk(b){
    const targets=[...st.sel].filter(i=>!b.only||b.only(i));
    if(!targets.length){toast("ไม่มี"+noun+"ที่ทำรายการนี้ได้");return}
    if(!await ask((b.confirm?b.confirm(targets.length):`${b.label} ${targets.length} ${noun}?`)+(targets.length<st.sel.size?`\n(ข้าม ${st.sel.size-targets.length} ${noun}ที่ใช้ไม่ได้กับรายการนี้)`:"")))return;
    let ok=0,bad=0,err="";document.querySelectorAll(".lst-bulk button").forEach(x=>x.disabled=true);
    for(const id of targets){try{await b.run(id);ok++;st.sel.delete(id)}catch(e){bad++;if(!err)err=e.message}}
    toast(`${b.label}: สำเร็จ ${ok}`+(bad?` · ไม่สำเร็จ ${bad} (${err})`:""));if(o.reload)o.reload()}
  draw()}

      try{const r=await api("/ai/diagnose",{method:"POST",body:{scope,id:id?+id:null}});AIOUT[k]=r;show(k,r)}finally{b.disabled=false;b.textContent=old}})})}

/* ---- maintenance mode + who depends on this gateway ---- */
const MEND={online:"เมื่อเกตเวย์กลับมาออนไลน์",manual:"เมื่อกดสิ้นสุดเอง"};
const hhmm=iso=>new Date(iso).toLocaleString("th-TH-u-ca-buddhist",{timeZone:"Asia/Bangkok",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+" น.";
const maintEnd=m=>m.end==="time"&&m.until?" "+hhmm(m.until):MEND[m.end]||MEND.online;
function maintHTML(g,sysLine){
  const m=g.maint;

      <span>${m.since?"เริ่ม "+hhmm(m.since)+(m.by?" โดย "+esc(m.by):"")+" · ":""}สิ้นสุด${maintEnd(m)}</span><br>
      <span>ระหว่างนี้ไม่ส่ง LINE เรื่องเกตเวย์นี้ แต่แดชบอร์ดยังแสดงสถานะจริง (ตอนนี้: ${GWS[g.status][0]} ${GWS[g.status][1]})</span></div>
    <div class="row">${m.end==="time"?'<button class="btn" id="gmx">ขยายเวลา +1 ชม.</button>':""}<button class="btn p" id="gmo">สิ้นสุดการซ่อมบำรุง</button></div>
    ${g.offline?'<p class="hint">ถ้ากดสิ้นสุดตอนที่เกตเวย์ยังออฟไลน์ ระบบจะส่ง LINE แจ้งทันที 1 ครั้ง แล้วเตือนซ้ำตามปกติ</p>':""}`;
  const opt=(v,t,on)=>`<label class="chip"><input type="radio" name="gme" value="${v}" ${on?"checked":""}><span>${t}</span></label>`;

    <div class="row">งานที่ทำ <input id="gmr" maxlength="200" size="34" placeholder="เช่น เปลี่ยนสายแลน / ย้ายจุดติดตั้ง"></div>
    <div class="row"><span>สิ้นสุดเมื่อ</span><div class="chips">${opt("h1","1 ชม.",!g.offline)}${opt("h4","4 ชม.")}${opt("m8","พรุ่งนี้ 08:00")}${opt("online","กลับมาออนไลน์",g.offline)}${opt("manual","กดสิ้นสุดเอง")}</div></div>
    <p class="hint" id="gmh"></p>
    <div class="row"><button class="btn p" id="gms">🔧 เข้าโหมดซ่อมบำรุง</button></div>
    ${!sysLine?'<p class="hint">หมายเหตุ: ตอนนี้ปิดการแจ้งเตือนเกตเวย์ทาง LINE ทั้งระบบอยู่ (หน้าตั้งค่า → ผู้รับแจ้งเตือน)</p>':""}`}
/* "tomorrow 08:00" in Bangkok time, whatever the browser's time zone */
function maintUntil(v){const now=Date.now();
  if(v==="h1")return new Date(now+3600e3);if(v==="h4")return new Date(now+4*3600e3);
  if(v==="m8"){const b=new Date(now+7*3600e3);return new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate()+1,8-7))}
  return null}
let gImp=null;
async function maintWire(g,glp){
  const name=g.label||g.gateway_id;
  const hint=()=>{const v=(document.querySelector("input[name=gme]:checked")||{}).value,u=maintUntil(v);if($("#gmh"))$("#gmh").textContent=u?"สิ้นสุด "+hhmm(u.toISOString())+" — ถ้าถึงเวลาแล้วเกตเวย์ยังไม่กลับมา ระบบจะส่ง LINE เตือน":v==="online"?"ออกจากโหมดซ่อมเองเมื่อเกตเวย์กลับมาออนไลน์ แล้วส่ง LINE ว่าซ่อมเสร็จ":"ต้องกดสิ้นสุดเอง — อย่าลืมกดเมื่อซ่อมเสร็จ"};
  document.querySelectorAll("input[name=gme]").forEach(x=>x.onchange=hint);hint();
  if($("#gms"))$("#gms").onclick=async()=>{const v=document.querySelector("input[name=gme]:checked").value,u=maintUntil(v);
    const n=gImp?gImp.only_here:0;
    const risk=n?`\n\n⚠️ มีปุ่มผู้ป่วย ${n} เครื่องที่ใช้เกตเวย์นี้อย่างเดียว ระหว่างซ่อมจะส่งเหตุไม่ถึง — ควรโทรแจ้งหรือเช็กอาการเป็นระยะ (รายชื่ออยู่ในการ์ดซ่อมบำรุง)`:"";
    if(!await ask(`เข้าโหมดซ่อมบำรุง: ${name}?\nไม่ส่ง LINE เรื่องเกตเวย์นี้ จนถึง${u?" "+hhmm(u.toISOString()):v==="online"?"เมื่อกลับมาออนไลน์":"เมื่อกดสิ้นสุดเอง"}${risk}`))return;
    glp({maintenance:{on:true,end:u?"time":v,until:u?u.toISOString():null,reason:$("#gmr").value}})};
  if($("#gmo"))$("#gmo").onclick=async()=>{if(!await ask(`สิ้นสุดการซ่อมบำรุง ${name}?${g.offline?"\nเกตเวย์ยังออฟไลน์อยู่ ระบบจะส่ง LINE แจ้งทันที":""}`))return;glp({maintenance:{on:false}})};
  if($("#gmx"))$("#gmx").onclick=()=>{const b=Math.max(Date.now(),new Date(g.maint.until).getTime());glp({maintenance:{on:true,end:"time",until:new Date(b+3600e3).toISOString(),reason:g.maint.reason}})};
  const box=$("#gimp");gImp=null;
  try{const r=await api(`/gateways/${g.id}/impact`);gImp=r;if(!document.body.contains(box))return;
    if(!r.total){box.innerHTML='<p class="mut">7 วันที่ผ่านมา ไม่มีปุ่มผู้ป่วยที่ส่งผ่านเกตเวย์นี้</p>';return}
    const only=r.devices.filter(x=>x.only_here),rest=r.devices.filter(x=>!x.only_here);
    const tr=x=>`<tr><td>${x.patient?esc(x.patient.full_name):'<span class="mut">ยังไม่ผูกผู้ป่วย</span>'}${x.patient?.village?`<div class="mut">${esc(x.patient.village)}</div>`:""}</td><td>${x.patient?.phone?`<a href="tel:${esc(x.patient.phone)}">${esc(x.patient.phone)}</a>`:"-"}</td><td>${esc(x.label)}</td><td>${ago(x.last_seen)}</td></tr>`;
    const tb=rows=>`<div class="tw"><table><tr><th>ผู้ป่วย</th><th>โทร</th><th>ปุ่ม</th><th>ส่งล่าสุด</th></tr>${rows.map(tr).join("")}</table></div>`;
    box.innerHTML=`<div class="gi-sum"><span>ปุ่มผู้ป่วยที่ส่งผ่านเกตเวย์นี้ (7 วันล่าสุด) <b>${r.total}</b> เครื่อง</span>${only.length?`<span class="gi-bad">ใช้เกตเวย์นี้อย่างเดียว <b>${only.length}</b> เครื่อง</span>`:'<span class="gi-ok">ทุกเครื่องมีเกตเวย์อื่นรับได้ด้วย</span>'}</div>
      ${only.length?`<p class="mut">ถ้าเกตเวย์นี้ดับ ปุ่มเหล่านี้จะส่งเหตุไม่ถึง — ระหว่างซ่อมควรโทรแจ้งผู้ป่วย/ญาติ หรือเช็กอาการเป็นระยะ</p>${tb(only)}`:""}
      ${rest.length?`<details class="gi-more"><summary>มีเกตเวย์อื่นรับได้ด้วย ${rest.length} เครื่อง</summary>${tb(rest)}</details>`:""}
      <p class="hint">นับจากสัญญาณที่เกตเวย์ได้รับจริงใน 7 วัน · ช่วงแรกหลังอัปเดต ระบบยังรู้แค่เกตเวย์ล่าสุดของแต่ละปุ่ม จึงอาจนับ "อย่างเดียว" มากกว่าความจริง</p>`}
  catch(e){if(document.body.contains(box))box.innerHTML='<span class="mut">ตรวจรายชื่อไม่สำเร็จ</span>'}}

    $("#gky").onclick=guard(async()=>{const r=await api(`/gateways/${g.id}/agent-key`);$("#gkv").innerHTML=` <code style="user-select:all">${esc(r.key)}</code> <span class="mut">ใส่เป็น AGENT_KEY ใน /etc/sos-gateway.env บนเกตเวย์ — เป็นความลับ (การดูถูกบันทึก)</span>`});

// ---------------- system update (GitHub) — admin only; the host updater does the work (docs/UPDATE.md) ----------------
let upSawBusy=false;
const UPST={idle:["ok","พร้อม"],done:["ok","สำเร็จ"],failed:["bad","ไม่สำเร็จ"],queued:["mut","รอคิว"],checking:["mut","กำลังตรวจ…"],updating:["mut","กำลังอัปเดต…"],rolling_back:["bad","กำลังย้อนกลับ…"]};
const verLine=v=>v?`<code>${esc(v.short)}</code> ${esc(v.subject)} <span class="mut">· ${fmt(v.date)}</span>`:'<span class="mut">-</span>';
/* ---- update progress: steps reported by infra/scripts/sos-update.sh (status.step), estimated fill inside a step ---- */
const UPS=["ตรวจเวอร์ชันบน GitHub","สำรองฐานข้อมูล","ดึงโค้ดใหม่","Build และเริ่มระบบใหม่","ตรวจว่าระบบทำงาน"];
const UPB=[0,4,14,20,82,100],UPT=[6,25,6,100,30];   // % at start of each step, typical seconds per step
let upLast=null,upPct=0,upTick=0,upOffline=false;
function upStep(st,queued){
  if(st.state==="done")return 6;if(queued)return 0;
  if(st.step)return st.step;const m=st.message||"";   // older updater without step numbers
  return /ตรวจว่าระบบ/.test(m)?5:/build/i.test(m)?4:/ดึงโค้ด/.test(m)?3:/สำรอง/.test(m)?2:1}
function upPctOf(st,k){
  if(k>=6)return 100;if(k<1)return 1;
  const t0=Date.parse(st.step_at||st.updated_at||"")||Date.now(),el=Math.max(0,(Date.now()-t0)/1000);
  return UPB[k-1]+(UPB[k]-UPB[k-1])*0.92*(1-Math.exp(-el/UPT[k-1]))}
const mmss=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")};
function upProgHTML(st,queued){
  const k=upStep(st,queued),fail=st.state==="failed",rb=st.state==="rolling_back",done=st.state==="done";
  const t0=Date.parse(st.started_at||"")||0,t1=Date.parse(st.finished_at||"")||Date.now(),el=t0?mmss((t1-t0)/1000):"";
  const head=done?"อัปเดตสำเร็จ":fail?"อัปเดตไม่สำเร็จ":rb?"กำลังย้อนกลับเวอร์ชันเดิม":queued?"รอตัวอัปเดตบนเซิร์ฟเวอร์รับคำขอ…":`ขั้นที่ ${k} จาก 5 · ${UPS[k-1]}`;
  return `<div class="upg ${done?"ok":fail||rb?"bad":""}" id="upprog" role="status" aria-live="polite">
    <div class="upg-h"><b>${head}</b><span><span id="uppct">${Math.round(fail||rb?upPct:upPctOf(st,k))}%</span>${el?` · <span id="upel">${done||fail?"ใช้เวลา":"ผ่านไป"} ${el}</span>`:""}</span></div>
    <div class="upg-bar"><span id="upbar" style="width:${upPct}%"></span></div>
    <ol class="upg-s">${UPS.map((n,i)=>{const j=i+1,c=j<k||done?"d":j===k?(fail||rb?"x":"a"):"";return `<li class="${c}"><i></i><span>${n}</span></li>`}).join("")}</ol>
    <p class="upg-m" id="upmsg">${upOffline&&!done&&!fail?"ระบบกำลังเริ่มใหม่ หน้าเว็บจะกลับมาเองเมื่อพร้อม…":esc(st.message||"")}</p>
    ${done?'<div class="row"><button class="btn g" id="uprl">โหลดหน้าใหม่เพื่อใช้เวอร์ชันใหม่</button></div>':""}</div>`}
function upAnimate(st,queued){   // move the bar from its last width to the new one so the transition shows
  const bar=$("#upbar");if(!bar)return;const k=upStep(st,queued),bad=st.state==="failed"||st.state==="rolling_back";
  const to=bad?upPct:Math.max(upPct,upPctOf(st,k));requestAnimationFrame(()=>{bar.style.width=to+"%"});upPct=to;
  const pc=$("#uppct");if(pc)pc.textContent=Math.round(to)+"%";
  if(st.started_at&&!st.finished_at){const e=$("#upel");if(e)e.textContent="ผ่านไป "+mmss((Date.now()-Date.parse(st.started_at))/1000)}}
function upTicker(on){clearInterval(upTick);upTick=0;if(on)upTick=setInterval(()=>{if(page!=="update"||!upLast){clearInterval(upTick);return}upAnimate(upLast.st,upLast.q)},1000)}
async function loadUpdate(){
  if(role!=="admin"){$("#main").innerHTML='<div class="warn">เฉพาะผู้ดูแลระบบ</div>';return}
  clearTimeout(timer);let s;
  try{s=await api("/system/update")}
  catch(e){if(page!=="update")return;
    if(upSawBusy&&upLast){upOffline=true;const st={...upLast.st};if((st.step||0)<4)st.step=4;
      $("#main").innerHTML=`<div class="card"><h3>อัปเดตระบบ</h3>${upProgHTML(st,false)}</div>`;upLast={st,q:false};upAnimate(st,false);upTicker(true)}
    else $("#main").innerHTML=`<div class="card"><h3>อัปเดตระบบ</h3><p>ติดต่อเซิร์ฟเวอร์ไม่ได้ (${esc(e.message)})</p></div>`;
    timer=setTimeout(()=>{if(page==="update")loadUpdate()},4000);return}
  if(page!=="update")return;
  const st=s.status||{},busy=s.busy,state=s.pending?"queued":(st.state||"idle"),[cls,lbl]=UPST[state]||["mut",state];
  if(busy)upSawBusy=true;
  const finished=!busy&&upSawBusy&&(state==="done"||state==="failed");upOffline=false;
  const showProg=(busy&&(st.request?.action==="update"||state==="updating"||state==="rolling_back"||state==="queued"))||finished;
  if(!showProg)upPct=0;
  if(!s.installed){$("#main").innerHTML=`<div class="card"><h3>อัปเดตระบบ</h3><div class="warn">ยังไม่ได้ติดตั้งตัวอัปเดตบนเซิร์ฟเวอร์ — ให้ผู้ดูแลเซิร์ฟเวอร์รัน <code>sudo bash infra/scripts/setup-updater.sh</code> หนึ่งครั้ง (ดู docs/UPDATE.md)</div></div>`;return}
  const ch=st.changes||[],n=st.behind||0,lu=st.last_update;
  $("#main").innerHTML=`<div class="card"><h3>อัปเดตระบบ <span class="mut" style="font-weight:normal">(โค้ดจาก GitHub · สาขา ${esc(st.branch||"main")})</span></h3>
   <div class="row"><b>เวอร์ชันที่ใช้อยู่:</b> ${verLine(st.current)}</div>
   <div class="row"><b>ล่าสุดบน GitHub:</b> ${verLine(st.latest)}</div>
   <div class="row mut">ตรวจล่าสุด ${fmt(st.checked_at)}${lu?` · อัปเดตครั้งก่อน ${fmt(lu.at)} <code>${esc(lu.from.slice(0,7))}</code> → <code>${esc(lu.to.slice(0,7))}</code> ${lu.ok?'<span class="ok">สำเร็จ</span>':'<span class="bad">ไม่สำเร็จ (ย้อนกลับ)</span>'}`:""}</div>
   ${showProg?upProgHTML(st,state==="queued"):`<div class="row"><b>สถานะ:</b> <span class="${cls}">${esc(lbl)}</span> ${esc(st.message||"")}</div>`}
   <div class="row"><button class="btn" id="upchk" ${busy?"disabled":""}>ตรวจหาอัปเดต</button>
     <button class="btn p" id="upgo" ${busy||!n?"disabled":""}>อัปเดตตอนนี้${n?` (${n} รายการ)`:""}</button></div>
   ${n?`<h4>มีอะไรใหม่ (${n})</h4><ul>${ch.map(c=>`<li><code>${esc(c.short)}</code> ${esc(c.subject)} <span class="mut">· ${esc(c.author)} · ${fmt(c.date)}</span></li>`).join("")}</ul>`:'<p class="mut">ไม่มีเวอร์ชันใหม่ (กด "ตรวจหาอัปเดต" เพื่อเช็กกับ GitHub อีกครั้ง — ระบบเช็กเองทุก 6 ชั่วโมง)</p>'}
   <p class="mut">ขั้นตอนอัปเดต: สำรองฐานข้อมูล → ดึงโค้ด → build ใหม่ → ตรวจว่าระบบทำงาน — ถ้าไม่ผ่าน ระบบจะ<b>ย้อนกลับเวอร์ชันเดิมให้อัตโนมัติ</b> · ระหว่างอัปเดต (ประมาณ 1–5 นาที) หน้าเว็บและการส่ง LINE จะหยุดชั่วคราว ควรทำนอกช่วงที่มีเคสค้าง</p>
   <details ${busy||state==="failed"?"open":""}><summary>บันทึกการทำงาน (log)</summary><pre style="white-space:pre-wrap;max-height:320px;overflow:auto;font-size:12px;background:#0f1720;color:#d6e2ee;padding:8px;border-radius:8px">${esc((s.log||[]).join("\n"))||"-"}</pre></details></div>`;
  if($("#uprl"))$("#uprl").onclick=()=>location.reload();
  const send=action=>guard(async()=>{await api("/system/update",{method:"POST",body:{action}});upSawBusy=action==="update";if(upSawBusy)upPct=0;toast(action==="update"?"ส่งคำขออัปเดตแล้ว":"กำลังตรวจกับ GitHub…");loadUpdate()})();
  $("#upchk").onclick=()=>send("check");
  $("#upgo").onclick=guard(async()=>{
    const open=(await api("/cases?state=new")).length;
    if(!await ask(`อัปเดตเป็น ${st.latest?st.latest.short:"เวอร์ชันล่าสุด"} (${n} รายการ)?\n\nระหว่างอัปเดตประมาณ 1–5 นาที หน้าเว็บและการแจ้ง LINE จะหยุดชั่วคราว`+(open?`\n\n⚠️ ขณะนี้มีเคสรอรับเรื่อง ${open} เคส — แนะนำให้จัดการก่อน`:"")+"\n\nระบบจะสำรองฐานข้อมูลก่อน และย้อนกลับเองถ้าอัปเดตไม่ผ่าน"))return;
    send("update")});
  if(showProg){upLast={st,q:state==="queued"};upAnimate(st,state==="queued")}else upLast=null;
  upTicker(showProg&&busy);
  if(busy)timer=setTimeout(()=>{if(page==="update")loadUpdate()},3000);
}

  authShell(`<form class="auth-card" id="mf" novalidate><div class="auth-logo"><div class="shield">🔐</div></div>

    <label class="fld"><span id="mlbl">รหัส 6 หลัก</span><input id="mcode" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></label>
    <button class="btn p big" id="mgo" type="submit">ยืนยัน</button>
    <div class="alt" style="margin-top:12px"><button type="button" class="btn" id="mbk">ใช้รหัสสำรอง</button><button type="button" class="btn" id="mcx">← กลับ</button></div>
    <p class="foot">รหัสเปลี่ยนทุก 30 วินาที · ทำรายการภายใน 5 นาที</p></form>`);
  const c=$("#mcode"),err=$("#merr");c.focus();
  c.oninput=()=>{if(!backup){c.value=c.value.replace(/\D/g,"").slice(0,6);if(c.value.length===6)$("#mf").requestSubmit()}};
  $("#mbk").onclick=()=>{backup=!backup;c.value="";c.maxLength=backup?9:6;c.inputMode=backup?"text":"numeric";c.placeholder=backup?"XXXX-XXXX":"••••••";c.classList.toggle("otp",!backup);
    $("#mlbl").textContent=backup?"รหัสสำรอง (ใช้ได้ครั้งเดียว)":"รหัส 6 หลัก";$("#mbk").textContent=backup?"ใช้รหัสจากแอป":"ใช้รหัสสำรอง";c.focus()};
  $("#mcx").onclick=()=>{sessionStorage.removeItem("mt");render()};
  $("#mf").onsubmit=async e=>{e.preventDefault();err.hidden=true;if(!c.value.trim())return;busyBtn($("#mgo"),true);
    try{const r=await api("/login/2fa",{method:"POST",body:{ticket,code:c.value}});sessionStorage.removeItem("mt");
      token=r.token;role=r.role;sessionStorage.setItem("tk",token);sessionStorage.setItem("role",role);sessionStorage.setItem("nm",r.name);
      if(r.must_change)sessionStorage.setItem("mc","1");render();
      if(r.backup_codes_left<=3&&backup)setTimeout(()=>toast(`เหลือรหัสสำรอง ${r.backup_codes_left} ชุด — สร้างใหม่ที่ "บัญชีของฉัน"`),600)}
    catch(x){if(/หมดเวลา|ล็อก|locked/.test(x.message)){sessionStorage.removeItem("mt")}
      err.textContent=/locked/.test(x.message)?"บัญชีถูกล็อกชั่วคราว 15 นาที เพราะใส่รหัสผิดหลายครั้ง":x.message;err.hidden=false;busyBtn($("#mgo"),false,"ยืนยัน");c.select();
      if(/หมดเวลา|locked/.test(x.message))setTimeout(render,2500)}}}

// ---------------------------------------------------------------- USB provisioning (Web Serial)
class SerialLink{
  constructor(){this.port=null;this.lines=[];this.waiters=[];this.buf="";this.writer=null;this.reader=null;this.closed=false;this.stopping=false}
  static supported(){return "serial" in navigator}
  async open(port){
    this.port=port||await navigator.serial.requestPort();await this.port.open({baudRate:115200});
    this.writer=this.port.writable.getWriter();this._pump()}
  // Boards with a separate USB-UART chip (Heltec V2 / CP2102) produce a BREAK/framing error when the ESP32 restarts.
  // Web Serial reports that as a non-fatal read error and hands out a fresh readable stream — so keep reading
  // until the port is really gone (readable === null) or close() was called.
  async _pump(){const dec=new TextDecoder();
    while(!this.stopping&&this.port&&this.port.readable){
      this.reader=this.port.readable.getReader();let ended=false;
      try{for(;;){const {value,done}=await this.reader.read();if(done){ended=true;break}this.buf+=dec.decode(value,{stream:true});
        let i;while((i=this.buf.search(/\r?\n/))>=0){const l=this.buf.slice(0,i).trim();this.buf=this.buf.slice(i).replace(/^\r?\n/,"");if(l){this.lines.push(l);this._wake()}}}}catch{this.buf=""}
      finally{try{this.reader.releaseLock()}catch{}}
      if(ended||this.stopping)break;
      await new Promise(r=>setTimeout(r,100))}
    this.closed=true;this._wake()}
  _wake(){this.waiters.splice(0).forEach(f=>f())}
  async send(cmd){await this.writer.write(new TextEncoder().encode(cmd+"\n"))}
  flush(){this.lines.length=0}
  // wait for a line starting with prefix; lines starting with ERR reject
  async expect(prefix,ms){const end=Date.now()+ms;
    for(;;){while(this.lines.length){const l=this.lines.shift();if(l.startsWith(prefix))return l;if(l.startsWith("ERR"))throw new Error("เครื่องตอบ: "+l)}
      const left=end-Date.now();if(left<=0)throw new Error("ไม่มีคำตอบ "+prefix+" จากเครื่อง");if(this.closed)throw new Error("ขาดการเชื่อมต่อ USB");
      await new Promise(r=>{const t=setTimeout(r,left);this.waiters.push(()=>{clearTimeout(t);r()})})}}
  async ping(){for(let i=0;i<5;i++){this.flush();await this.send("PING");try{return await this.expect("PONG",1500)}catch{}}throw new Error("เครื่องไม่ตอบ PING — ตรวจสาย USB (ต้องเป็นสายข้อมูล) และว่าอัปโหลดเฟิร์มแวร์แล้ว")}
  async close(){this.stopping=true;try{await this.reader.cancel()}catch{}try{this.writer.releaseLock()}catch{}try{await this.port.close()}catch{}}
}

// Writes the application image only (0x10000): bootloader, partition table and the NVS partition holding the
// LoRaWAN keys stay as they are, so the button keeps its identity and does not need provisioning again.
let FWI=null,FWT=0;
async function fwLatest(force){if(role==="viewer")return null;if(force||Date.now()-FWT>300000){FWT=Date.now();try{FWI=await api("/firmware")}catch(e){FWI=null}}return FWI}
const verN=v=>String(v||"").split(".").map(x=>+x||0),verLt=(a,b)=>{const x=verN(a),y=verN(b);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)<(y[i]||0)}return false};
function fwNewest(){return (FWI?.builds||[]).reduce((m,b)=>!m||verLt(m,b.version)?b.version:m,"")}
function fwBadge(v){const n=fwNewest();return v&&n&&verLt(v,n)?` <span class="tag accepted" title="เวอร์ชันล่าสุด ${esc(n)}">มี ${esc(n)}</span>`:""}
// MD5 of a Uint8Array → hex (esptool-js needs it to verify what landed in flash)
function md5hex(u8){const K=new Uint32Array(64),S=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0;
  const n=u8.length,len=((n+8>>6)+1)*64,b=new Uint8Array(len);b.set(u8);b[n]=0x80;const dv=new DataView(b.buffer);
  dv.setUint32(len-8,(n*8)>>>0,true);dv.setUint32(len-4,Math.floor(n/0x20000000)>>>0,true);
  let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;const M=new Uint32Array(16);
  for(let o=0;o<len;o+=64){for(let j=0;j<16;j++)M[j]=dv.getUint32(o+j*4,true);let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){let F,g;
      if(i<16){F=(B&C)|(~B&D);g=i}else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}else if(i<48){F=B^C^D;g=(3*i+5)%16}else{F=C^(B|~D);g=(7*i)%16}
      F=(F+A+K[i]+M[g])>>>0;A=D;D=C;C=B;B=(B+((F<<S[i])|(F>>>(32-S[i]))))>>>0}
    a0=(a0+A)>>>0;b0=(b0+B)>>>0;c0=(c0+C)>>>0;d0=(d0+D)>>>0}
  return [a0,b0,c0,d0].map(x=>[0,8,16,24].map(s=>((x>>>s)&255).toString(16).padStart(2,"0")).join("")).join("")}
async function sha256hex(u8){const h=await crypto.subtle.digest("SHA-256",u8);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}

  const bar=box.querySelector(".fwbar"),barS=bar.querySelector("span");
  let port=null,link=null,transport=null,cur=null,before={fw:"",eui:""},build=null,step="usb";
  const report=(ok,error="")=>api("/firmware/flashed",{method:"POST",body:{dev_eui:(before.eui||"").slice(0,16),env:build?.env||pick||"-",version:build?.version||"-",from_version:before.fw||"",ok,error:String(error).slice(0,200)}}).catch(()=>{});
  const readInfo=async lk=>{await lk.ping();lk.flush();await lk.send("INFO");const l=await lk.expect("INFO",3000);
    return {fw:(l.match(/fw=([\d.]+)/)||[])[1]||"",eui:(l.match(/deveui=([0-9a-f]{16})/i)||[])[1]?.toLowerCase()||"",prov:/provisioned=1/.test(l)}};

    // 2/3 — chip decides which images fit; the image must match the manifest byte for byte

    const esp=await import("./vendor/esptool/esptool-0.7.1.js");

    const loader=new esp.ESPLoader({transport,baudrate:460800,romBaudrate:115200,terminal:{clean(){},writeLine(){},write(){}}});
    const desc=await loader.main("default_reset");const chip=loader.chip.CHIP_NAME;
    const fits=m.builds.filter(b=>b.chip===chip);
    if(!fits.length)throw new Error(`ชิป ${chip} ไม่มีเฟิร์มแวร์ที่ตรงกัน (มีสำหรับ ${[...new Set(m.builds.map(b=>b.chip))].join(", ")})`);
    if(pick){build=fits.find(b=>b.env===pick);if(!build)throw new Error(`บอร์ดที่เลือกไม่ตรงกับชิปที่เสียบอยู่ (${chip}) — เลือก "ตรวจอัตโนมัติ" หรือบอร์ดที่ถูกต้อง`)}
    else build=fits.length===1?fits[0]:(fits.find(b=>/gps/.test(b.env)===!!cur?.loc)||fits[0]);
    set("chip","ok",`${desc} → ${build.label}`);
    set("dl","run");step="dl";
    const r=await fetch(`/api/firmware/${encodeURIComponent(build.env)}.bin`,{headers:{authorization:"Bearer "+token},cache:"no-store"});
    if(!r.ok)throw new Error("ดาวน์โหลดไฟล์ไม่สำเร็จ ("+r.status+")");
    const img=new Uint8Array(await r.arrayBuffer());
    if(img.length!==build.size||await sha256hex(img)!==build.sha256)throw new Error("ไฟล์ที่ดาวน์โหลดไม่ตรงกับที่ build ไว้ (SHA-256) — ลองใหม่อีกครั้ง");
    set("dl","ok",`${build.version} · ${(img.length/1024).toFixed(0)} KB · SHA-256 ตรง`);
    if(before.fw&&!verLt(before.fw,build.version)&&!await ask(`เครื่องนี้ใช้เวอร์ชัน ${before.fw} อยู่แล้ว\nจะเขียนเวอร์ชัน ${build.version} ทับหรือไม่`,{ok:"เขียนทับ"}))throw new Error("ยกเลิกแล้ว — เครื่องยังใช้เวอร์ชันเดิม");
    // 4 — write + verify (esptool compares the MD5 of what is in flash with ours)
    set("write","run");step="write";bar.hidden=false;

    set("write","ok","เขียนและตรวจ MD5 แล้ว");bar.hidden=true;

      $("#fwres").innerHTML=`<div class="warn">เขียนเฟิร์มแวร์ ${esc(build.version)} สำเร็จ แต่ยืนยันหลังรีสตาร์ตไม่ได้</div>`;return}
    if(after.fw!==build.version)throw new Error(`เครื่องรีสตาร์ตแล้วยังรายงานเวอร์ชัน ${after.fw||"?"} (ควรเป็น ${build.version})`);
    if(before.eui&&after.eui&&after.eui!==before.eui)throw new Error(`DevEUI เปลี่ยนจาก ${before.eui} เป็น ${after.eui} — ตรวจการติดตั้งเครื่องนี้ใหม่`);
    before.eui=before.eui||after.eui;
    set("boot","ok",`เวอร์ชัน ${after.fw}${after.prov?" · คีย์ LoRaWAN ยังอยู่":" · เครื่องยังไม่ได้ติดตั้งคีย์ (ใช้ขั้นตอนติดตั้งด้านบน)"}`);
    await report(true);FWT=0;
    $("#fwres").innerHTML=`<div class="fwdone">${ico("check")}<div><b>อัปเดตเป็นเวอร์ชัน ${esc(after.fw)} สำเร็จ</b><br><span class="mut">${cur?esc(cur.label)+" · ":""}ถอดสาย USB แล้วนำเครื่องไปติดตั้งได้ เครื่องจะเชื่อมต่อเครือข่ายใหม่เอง</span></div></div>`;
    toast(`อัปเดตเฟิร์มแวร์เป็น ${after.fw} แล้ว`,"ok");
  }catch(e){
    const raw=e?.message||String(e),msg=e?.name==="NotFoundError"?"ไม่ได้เลือกพอร์ต":/Failed to open|already open|NetworkError/i.test(raw)?"เปิดพอร์ตไม่ได้ — ปิดโปรแกรมอื่นที่ใช้พอร์ตนี้อยู่ (Serial Monitor) แล้วลองใหม่"
      :step==="chip"&&!/[\u0E00-\u0E7F]/.test(raw)?"เข้าโหมดอัปเดตไม่ได้ ("+raw+") — กดปุ่ม PRG ค้างไว้ แล้วกด RST หนึ่งครั้ง จากนั้นกดเริ่มอัปเดตใหม่"

  }finally{try{link&&await link.close()}catch{}try{transport&&await transport.disconnect()}catch{}go.disabled=false}
}

function parseLatLon(t){t=String(t||"").trim();let m=t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||t.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||t.match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
  if(!m)return null;const lat=+m[1],lon=+m[2];return Math.abs(lat)<=90&&Math.abs(lon)<=180&&!(lat===0&&lon===0)?{lat,lon}:null}
