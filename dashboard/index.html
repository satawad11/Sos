<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>ระบบแจ้งเหตุฉุกเฉิน รพ.สต.</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mut:#6b7885;--red:#c62828;--grn:#2e7d32;--amb:#ef6c00;--bd:#dde3e8;--pri:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#1a232c;--ink:#e6edf3;--mut:#93a1ad;--bd:#2c3a46}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}
nav button,.btn{border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--bd)}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.g{background:var(--grn);color:#fff;border-color:var(--grn)}.btn.r{background:var(--red);color:#fff;border-color:var(--red)}
main{padding:16px;min-width:0}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.new{background:var(--red);color:#fff;border-color:var(--red)}.accepted{background:var(--amb);color:#fff;border-color:var(--amb)}.closed{background:var(--grn);color:#fff;border-color:var(--grn)}
.alarm{border:3px solid var(--red);animation:b 1s infinite}@keyframes b{50%{background:#c6282833}}
input,select,textarea{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.mut{color:var(--mut)}
#toast{position:fixed;z-index:60;max-width:92vw;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;display:none}
.warn{background:#fff3cd;color:#664d03;padding:8px 12px;border-radius:8px}
@media print{body.rpt *{visibility:hidden}body.rpt #rpt,body.rpt #rpt *{visibility:visible}body.rpt #rpt{position:absolute;left:0;top:0;width:100%;color:#000}body *{visibility:hidden}#plabel,#plabel *{visibility:visible}#plabel{position:absolute;left:0;top:0;border:1px solid #000;padding:6px;width:60mm;color:#000;background:#fff}}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ---------- app shell: sidebar on desktop, drawer on tablet/phone ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"top top" "side main";min-height:100vh;min-height:100dvh}
.top{grid-area:top;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(90deg,#0d47a1,var(--pri));color:#fff;box-shadow:0 2px 8px #0002}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;flex:1;min-width:0}.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ham{display:none;background:#ffffff26;border:0;color:#fff;font-size:22px;width:42px;height:42px;border-radius:10px;cursor:pointer}
.top .btn{background:#ffffff26;color:#fff;border-color:transparent}.top .btn.on{background:#fff;color:var(--pri)}
#side{grid-area:side;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);height:calc(100dvh - 62px);overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:12px 10px;background:var(--card);border-right:1px solid var(--bd)}
#side nav{display:flex;flex-direction:column;gap:2px}
#side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
#side nav button:hover{background:var(--bg)}#side nav button.on{background:var(--pri);color:#fff;font-weight:600}
#side .ic{width:24px;text-align:center;font-size:18px}
.me{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--bd)}.me b{display:block;overflow:hidden;text-overflow:ellipsis}.me .row{flex-wrap:nowrap}.me .row .btn{flex:1;white-space:nowrap;padding:8px 10px}
.scrim{display:none}
main>.card:first-child{margin-top:0}main{max-width:1200px;width:100%}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}.tw>table{min-width:560px}
.btn,nav button{min-height:40px}
@media(max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
  .ham{display:inline-flex;align-items:center;justify-content:center}
  #side{position:fixed;top:0;left:0;bottom:0;z-index:50;width:min(300px,86vw);height:100%;transform:translateX(-105%);visibility:hidden;transition:transform .22s ease,visibility .22s;padding-top:calc(16px + env(safe-area-inset-top))}
  .shell.nav-open #side{transform:none;visibility:visible;box-shadow:4px 0 24px #0004}
  .shell.nav-open .scrim{display:block;position:fixed;inset:0;z-index:40;background:#0006}
}
@media(max-width:640px){
  main{padding:10px}.card{padding:12px;border-radius:10px}.brand{font-size:16px}.top .btn .lbl{display:none}
  .row>input,.row>select,.row>textarea{flex:1 1 100%}h2{font-size:20px}h3{font-size:17px}
}
/* ---------- sign-in / password screens ---------- */
.auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 600px at 10% -10%,#42a5f5 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#c62828 0,transparent 55%),linear-gradient(135deg,#0d47a1,#1565c0 55%,#283593)}
.auth-card{width:100%;max-width:410px;background:var(--card);color:var(--ink);border-radius:20px;padding:32px 28px 24px;box-shadow:0 20px 60px #0005;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.auth-logo{display:flex;justify-content:center;margin-bottom:10px}
.auth-card h1{font-size:23px;text-align:center;margin:4px 0 2px}.auth-card .sub{text-align:center;color:var(--mut);margin:0 0 22px;font-size:14px}
.fld{display:block;margin:0 0 14px}.fld>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.fld input{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);transition:border-color .15s,box-shadow .15s}
.fld input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px #1565c033}
.pwbox{position:relative}.pwbox input{padding-right:52px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mut);width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:18px}.eye:hover{background:var(--bd)}
.btn.big{width:100%;padding:13px;font-size:17px;font-weight:600;border-radius:12px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.auth .err{background:#fdecea;color:#8b1a1a;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.auth .caps{color:var(--amb);font-size:13px;margin:-8px 0 12px}
.auth .foot{text-align:center;color:var(--mut);font-size:12px;margin:18px 0 0}
.auth .alt{display:flex;gap:8px}.auth .alt .btn{flex:1}
.spin{width:18px;height:18px;border:2.5px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){.auth .err{background:#4a1515;color:#ffd6d6}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.step{display:flex;gap:8px;align-items:flex-start;margin:4px 0}.ok{color:var(--grn)}.bad{color:var(--red)}
:root{--pri2:#e3edfb;--red2:#fde8e8;--grn2:#e1f4e3;--amb2:#fff1d6;--sh:0 1px 2px #1018280d,0 4px 16px #1018280a;--r:14px}@media(prefers-color-scheme:dark){:root{--pri2:#16304f;--red2:#3b1a1f;--grn2:#12301f;--amb2:#33270c;--sh:0 1px 2px #0006}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi small{color:var(--mut);display:block;font-size:12px}.kpi b{font-size:26px;line-height:1.2}.kpi.hot b{color:var(--red)}

/* settings */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;width:max-content;max-width:100%;overflow-x:auto}
.pills button{border:0;background:transparent;color:var(--mut);font:inherit;padding:8px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pills button.on{background:var(--pri);color:#fff;font-weight:600}.pills .dot{width:7px;height:7px;border-radius:50%;background:var(--amb);display:none}.pills .dirty .dot{display:inline-block}
.sec[hidden]{display:none}
.chead{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}.chead .ci{width:36px;height:36px;border-radius:10px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;flex:none}
.chead p{margin:2px 0 0;color:var(--mut);font-size:13px}
.sf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px 24px;padding:14px 0;border-top:1px solid var(--bd);align-items:center}
.sf:first-of-type{border-top:0}.fl label{font-weight:600;display:block}.fl p{margin:2px 0 0;color:var(--mut);font-size:13px}
.inp{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:10px;background:var(--card);overflow:hidden}
.inp:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}.inp input{border:0;box-shadow:none!important;width:92px;text-align:right}
.inp span{padding:0 12px;color:var(--mut);background:var(--bg);align-self:stretch;display:flex;align-items:center;font-size:13px;border-left:1px solid var(--bd)}
.inp.bad3{border-color:var(--red)}
.hint{color:var(--mut);font-size:12.5px;margin:6px 0 0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--pri);color:var(--pri)}
.chip{position:relative;display:inline-block}.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-block;padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;user-select:none;min-width:44px;text-align:center}
.chip input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}.chip input:focus-visible+span{box-shadow:0 0 0 3px var(--pri2)}
.chip input:disabled+span{opacity:.6;cursor:not-allowed}
.sw{display:inline-flex;gap:10px;align-items:center;cursor:pointer}.sw input{position:absolute;opacity:0}
.sw i{width:42px;height:24px;border-radius:99px;background:var(--bd);position:relative;transition:background .2s;flex:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0004}
.sw input:checked+i{background:var(--grn)}.sw input:checked+i:after{transform:translateX(18px)}.sw input:focus-visible+i{box-shadow:0 0 0 3px var(--pri2)}
.savebar{position:sticky;bottom:12px;z-index:20;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;box-shadow:0 10px 40px #0004;margin-top:14px}
.savebar[hidden]{display:none}.savebar b{font-weight:600}.savebar .btn{border-color:transparent}
.hol{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--bd)}.hol:first-of-type{border-top:0}.hol span:nth-child(2){flex:1}
@media(max-width:640px){.sf{grid-template-columns:1fr}.pills{flex-wrap:nowrap;width:100%}.kpi b{font-size:22px}}
.warn.bad2{background:var(--red2);color:var(--red)}
.mk{box-sizing:border-box}.mk-gw{width:34px;height:34px;border-radius:10px;background:#fff;border:2px solid #16a34a;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px #0004}.mk-gw.off{border-color:#dc2626;background:#fee2e2}
.mk-dv{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0003,0 2px 6px #0004}.mk-dv.off{box-shadow:0 0 0 3px #dc2626}
.leaflet-tooltip.mk-tip{background:#fff;border:0;color:#111;font-weight:600;box-shadow:0 1px 4px #0003;padding:1px 6px;font-size:12px}.mk-tip:before{display:none}
.leaflet-popup-content{color:#16202e;font:14px/1.5 inherit}.leaflet-popup-content .mut{color:#64748b}
@media(prefers-color-scheme:dark){#mapc .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}}
</style></head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=iso=>iso?new Date(iso).toLocaleString("th-TH-u-ca-buddhist",{timeZone:"Asia/Bangkok",dateStyle:"short",timeStyle:"medium"}):"-";
const ST={new:"รอรับเรื่อง",accepted:"รับเรื่องแล้ว",closed:"ปิดเคส",cancelled:"ยกเลิกโดยผู้ป่วย"};
let token=sessionStorage.getItem("tk")||"",role=sessionStorage.getItem("role")||"",page="cases",ws=null,timer=null,audioOn=false;
async function api(path,opt={}){
  const r=await fetch("/api"+path,{...opt,headers:{"content-type":"application/json",...(token?{authorization:"Bearer "+token}:{}),...(opt.headers||{})},body:opt.body&&JSON.stringify(opt.body)});
  if(r.status===401&&path!=="/login"){logout();throw new Error("หมดเวลา กรุณาเข้าสู่ระบบใหม่")}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||("ผิดพลาด "+r.status));return j}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3500)}
const guard=f=>async(...a)=>{try{return await f(...a)}catch(e){toast(e.message)}};
function logout(){token="";sessionStorage.clear();if(ws)ws.close();render()}
function beep(){if(!audioOn)return;try{const c=new AudioContext(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},700)}catch{}}
function connectWS(){
  if(ws)ws.close();ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/ws?token="+encodeURIComponent(token));
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="case_new"){beep();toast("🚨 มีเหตุฉุกเฉินใหม่")}if(m.type==="gateway_state"){toast(m.state==="offline"?"⚠️ เกตเวย์ขาดการเชื่อมต่อ":"เกตเวย์กลับมาออนไลน์");if(page==="gateways"&&!devEdit)loadGateways()}if(page==="cases")loadCases()};
  ws.onclose=()=>{if(token)setTimeout(connectWS,3000)}}

const LOGO=(s=36)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="16" fill="#e53935"/><path d="M27 17h10v10h10v10H37v10H27V37H17V27h10z" fill="#fff"/><path d="M47 9a14 14 0 0 1 8 8M50 4a20 20 0 0 1 10 10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".85"/></svg>`;
const ICON={cases:"🚨",patients:"🧑‍🦳",caregivers:"🧑‍⚕️",devices:"📟",gateways:"📡",map:"🗺️",reports:"📊",privacy:"🔒",install:"🔌",users:"👥",update:"⬆️",settings:"⚙️",audit:"📜"};
const LS={get:k=>{try{return localStorage.getItem(k)||""}catch{return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
function authShell(inner){$("#app").innerHTML=`<div class="auth">${inner}</div>`}
function busyBtn(b,on,label){b.disabled=on;b.innerHTML=on?`<span class="spin"></span> กำลังดำเนินการ…`:label}
function eyeToggle(btn,input){btn.onclick=()=>{const s=input.type==="password";input.type=s?"text":"password";btn.textContent=s?"🙈":"👁";btn.setAttribute("aria-label",s?"ซ่อนรหัสผ่าน":"แสดงรหัสผ่าน");input.focus()}}
function capsWatch(input,el){const f=e=>{if(e.getModifierState)el.hidden=!e.getModifierState("CapsLock")};input.addEventListener("keydown",f);input.addEventListener("keyup",f)}
// wide tables scroll sideways on phones instead of squashing the page
new MutationObserver(()=>document.querySelectorAll("main table").forEach(t=>{if(!t.parentElement.classList.contains("tw")){const w=document.createElement("div");w.className="tw";t.replaceWith(w);w.appendChild(t)}})).observe(document.documentElement,{childList:true,subtree:true});

function render(){
  if(token&&sessionStorage.getItem("mc")==="1"){pwScreen(true);return}
  if(!token){
    authShell(`<form class="auth-card" id="lf" novalidate>
      <div class="auth-logo">${LOGO(64)}</div>
      <h1>ระบบแจ้งเหตุฉุกเฉิน</h1><p class="sub">ปุ่มแจ้งเหตุผู้ป่วยติดบ้าน · สำหรับเจ้าหน้าที่และผู้ดูแลระบบ</p>
      <div class="err" id="lerr" role="alert" hidden></div>
      <label class="fld"><span>ชื่อผู้ใช้</span><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="fld"><span>รหัสผ่าน</span><div class="pwbox"><input id="p" name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" id="eye" aria-label="แสดงรหัสผ่าน">👁</button></div></label>
      <div class="caps" id="caps" hidden>⇪ Caps Lock เปิดอยู่</div>
      <button class="btn p big" id="go" type="submit">เข้าสู่ระบบ</button>
      <p class="foot">ใช้งานเฉพาะผู้ได้รับอนุญาต · การเข้าใช้งานทุกครั้งถูกบันทึกตาม PDPA</p></form>`);
    const u=$("#u"),p=$("#p"),err=$("#lerr");u.value=LS.get("lu");(u.value?p:u).focus();eyeToggle($("#eye"),p);capsWatch(p,$("#caps"));
    $("#lf").onsubmit=async e=>{e.preventDefault();err.hidden=true;
      if(!u.value.trim()||!p.value){err.textContent="กรอกชื่อผู้ใช้และรหัสผ่าน";err.hidden=false;return}
      busyBtn($("#go"),true);
      try{const r=await api("/login",{method:"POST",body:{username:u.value.trim(),password:p.value}});
        token=r.token;role=r.role;sessionStorage.setItem("tk",token);sessionStorage.setItem("role",role);sessionStorage.setItem("nm",r.name||u.value.trim());LS.set("lu",u.value.trim());
        if(r.must_change)sessionStorage.setItem("mc","1");else sessionStorage.removeItem("mc");render()}
      catch(x){const m=/bad credentials/.test(x.message)?"ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง":/locked/.test(x.message)?"บัญชีถูกล็อกชั่วคราว 15 นาที เพราะใส่รหัสผิดหลายครั้ง":/Failed to fetch|NetworkError/.test(x.message)?"ติดต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ต":x.message;
        err.textContent=m;err.hidden=false;busyBtn($("#go"),false,"เข้าสู่ระบบ");p.select()}};
    return}
  const tabs=[["cases","เคสฉุกเฉิน"],["patients","ผู้ป่วย"],["caregivers","อสม./ผู้ดูแล"],["devices","อุปกรณ์"],["gateways","เกตเวย์"],["map","แผนที่"],["reports","รายงาน"],...(role!=="viewer"?[["privacy","PDPA"]]:[]),...(role==="admin"?[["install","ติดตั้งอุปกรณ์"],["users","ผู้ใช้"],["update","อัปเดตระบบ"]]:[]),["settings","ตั้งค่า"],["audit","บันทึกการใช้งาน"]];
  const RN={admin:"ผู้ดูแลระบบ",staff:"เจ้าหน้าที่",viewer:"ดูอย่างเดียว"};
  $("#app").innerHTML=`<div class="shell" id="shell"><header class="top"><button class="ham" id="ham" aria-label="เปิดเมนู">☰</button>
    <div class="brand">${LOGO(32)}<span>ระบบแจ้งเหตุฉุกเฉิน</span></div>

const UPST={idle:["ok","พร้อม"],done:["ok","สำเร็จ"],failed:["bad","ไม่สำเร็จ"],queued:["mut","รอคิว"],checking:["mut","กำลังตรวจ…"],updating:["mut","กำลังอัปเดต…"],rolling_back:["bad","กำลังย้อนกลับ…"]};

  if(role!=="admin"){$("#main").innerHTML='<div class="warn">เฉพาะผู้ดูแลระบบ</div>';return}

    timer=setTimeout(()=>{if(page==="update")loadUpdate()},4000);return}

  $("#main").innerHTML=`<div class="card"><h3>อัปเดตระบบ <span class="mut" style="font-weight:normal">(โค้ดจาก GitHub · สาขา ${esc(st.branch||"main")})</span></h3>

   <div class="row"><b>สถานะ:</b> <span class="${cls}">${busy?"⏳ ":""}${esc(lbl)}</span> ${esc(st.message||"")}</div>
   ${finished&&state==="done"?'<div class="row"><b class="ok">อัปเดตเสร็จแล้ว</b> — กด "โหลดหน้าใหม่" เพื่อใช้หน้าจอเวอร์ชันใหม่ <button class="btn g" id="uprl">โหลดหน้าใหม่</button></div>':""}
   <div class="row"><button class="btn" id="upchk" ${busy?"disabled":""}>🔍 ตรวจหาอัปเดต</button>

   ${n?`<h4>มีอะไรใหม่ (${n})</h4><ul>${ch.map(c=>`<li><code>${esc(c.short)}</code> ${esc(c.subject)} <span class="mut">· ${esc(c.author)} · ${fmt(c.date)}</span></li>`).join("")}</ul>`:'<p class="mut">ไม่มีเวอร์ชันใหม่ (กด "ตรวจหาอัปเดต" เพื่อเช็กกับ GitHub อีกครั้ง — ระบบเช็กเองทุก 6 ชั่วโมง)</p>'}
   <p class="mut">ขั้นตอนอัปเดต: สำรองฐานข้อมูล → ดึงโค้ด → build ใหม่ → ตรวจว่าระบบทำงาน — ถ้าไม่ผ่าน ระบบจะ<b>ย้อนกลับเวอร์ชันเดิมให้อัตโนมัติ</b> · ระหว่างอัปเดต (ประมาณ 1–5 นาที) หน้าเว็บและการส่ง LINE จะหยุดชั่วคราว ควรทำนอกช่วงที่มีเคสค้าง</p>

  if($("#uprl"))$("#uprl").onclick=()=>location.reload();
  const send=action=>guard(async()=>{await api("/system/update",{method:"POST",body:{action}});upSawBusy=action==="update";toast(action==="update"?"ส่งคำขออัปเดตแล้ว":"กำลังตรวจกับ GitHub…");loadUpdate()})();
  $("#upchk").onclick=()=>send("check");
  $("#upgo").onclick=guard(async()=>{
    const open=(await api("/cases?state=new")).length;

    send("update")});
  if(busy)timer=setTimeout(()=>{if(page==="update")loadUpdate()},3000);
}

// ---------------------------------------------------------------- USB provisioning (Web Serial)
class SerialLink{
  constructor(){this.port=null;this.lines=[];this.waiters=[];this.buf="";this.writer=null;this.reader=null;this.closed=false;this.stopping=false}
  static supported(){return "serial" in navigator}
  async open(){
    this.port=await navigator.serial.requestPort();await this.port.open({baudRate:115200});
    this.writer=this.port.writable.getWriter();this._pump()}
  // Boards with a separate USB-UART chip (Heltec V2 / CP2102) produce a BREAK/framing error when the ESP32 restarts.
  // Web Serial reports that as a non-fatal read error and hands out a fresh readable stream — so keep reading
  // until the port is really gone (readable === null) or close() was called.
  async _pump(){const dec=new TextDecoder();
    while(!this.stopping&&this.port&&this.port.readable){
      this.reader=this.port.readable.getReader();let ended=false;
      try{for(;;){const {value,done}=await this.reader.read();if(done){ended=true;break}this.buf+=dec.decode(value,{stream:true});
        let i;while((i=this.buf.search(/\r?\n/))>=0){const l=this.buf.slice(0,i).trim();this.buf=this.buf.slice(i).replace(/^\r?\n/,"");if(l){this.lines.push(l);this._wake()}}}}catch{this.buf=""}
      finally{try{this.reader.releaseLock()}catch{}}
      if(ended||this.stopping)break;
      await new Promise(r=>setTimeout(r,100))}
    this.closed=true;this._wake()}
  _wake(){this.waiters.splice(0).forEach(f=>f())}
  async send(cmd){await this.writer.write(new TextEncoder().encode(cmd+"\n"))}
  flush(){this.lines.length=0}
  // wait for a line starting with prefix; lines starting with ERR reject
  async expect(prefix,ms){const end=Date.now()+ms;
    for(;;){while(this.lines.length){const l=this.lines.shift();if(l.startsWith(prefix))return l;if(l.startsWith("ERR"))throw new Error("เครื่องตอบ: "+l)}
      const left=end-Date.now();if(left<=0)throw new Error("ไม่มีคำตอบ "+prefix+" จากเครื่อง");if(this.closed)throw new Error("ขาดการเชื่อมต่อ USB");
      await new Promise(r=>{const t=setTimeout(r,left);this.waiters.push(()=>{clearTimeout(t);r()})})}}
  async ping(){for(let i=0;i<5;i++){this.flush();await this.send("PING");try{return await this.expect("PONG",1500)}catch{}}throw new Error("เครื่องไม่ตอบ PING — ตรวจสาย USB (ต้องเป็นสายข้อมูล) และว่าอัปโหลดเฟิร์มแวร์แล้ว")}
  async close(){this.stopping=true;try{await this.reader.cancel()}catch{}try{this.writer.releaseLock()}catch{}try{await this.port.close()}catch{}}
}

   <ol><li>เสียบเครื่อง Heltec ด้วยสาย USB (สายข้อมูล) เข้าคอมพิวเตอร์เครื่องนี้ ซึ่งอัปโหลดเฟิร์มแวร์แล้ว</li><li>ตั้งป้ายชื่อ กด "เริ่มติดตั้ง" แล้วเลือกพอร์ตของเครื่องในหน้าต่างที่เด้งขึ้น</li><li>รอจนครบทุกขั้นตอน แล้วพิมพ์ป้าย QR ติดกล่อง</li></ol>
   <div class="row">ป้ายชื่อเครื่อง <input id="plbl" value="${next}" maxlength="64"><button class="btn p" id="pgo" ${st.configured&&supported?"":"disabled"}>เริ่มติดตั้ง</button></div>
   <div id="psteps"></div><div id="pres"></div></div>
   <p class="mut">คีย์ลับ (AppKey) สร้างที่เซิร์ฟเวอร์ ส่งให้หน้านี้ผ่าน HTTPS ครั้งเดียวเพื่อเขียนลงเครื่องผ่าน USB เท่านั้น ไม่เก็บในแดชบอร์ด ไม่แสดงบนจอ และไม่อยู่ใน audit log</p>`;
  if(!$("#pgo"))return;
  $("#pgo").onclick=async()=>{
    const label=$("#plbl").value.trim();if(!label){toast("ใส่ป้ายชื่อก่อน");return}
    $("#pgo").disabled=true;$("#pres").innerHTML="";
    const steps=[["usb","เชื่อมต่อ USB และตรวจเครื่อง"],["reg","ลงทะเบียนในระบบ (ChirpStack + แดชบอร์ด)"],["flash","เขียนคีย์ลงเครื่อง"],["verify","อ่านค่ากลับมายืนยัน"],["join","รอเครื่องเชื่อมต่อเครือข่าย (ข้ามได้ถ้ายังไม่มี gateway)"]];
    const mark=(k,cls,msg)=>{const e=document.getElementById("st-"+k);if(e)e.innerHTML=`<span class="${cls}">${cls==="ok"?"✔":cls==="bad"?"✘":"…"}</span> ${steps.find(x=>x[0]===k)[1]}${msg?` <span class="mut">${esc(msg)}</span>`:""}`};
    $("#psteps").innerHTML=steps.map(([k])=>`<div class="step" id="st-${k}"><span class="mut">○</span> ${steps.find(x=>x[0]===k)[1]}</div>`).join("");
    let reg=null,cur="usb";
    try{
      link=new SerialLink();await link.open();mark("usb","wait");await new Promise(r=>setTimeout(r,1500));await link.ping();mark("usb","ok","ตอบ PONG");
      cur="reg";mark("reg","wait");reg=await api("/provision/start",{method:"POST",body:{label}});mark("reg","ok",reg.dev_eui);
      cur="flash";mark("flash","wait");link.flush();await link.send(`PROV ${reg.dev_eui} ${reg.app_key} ${reg.join_eui}`);let okLine=null;try{okLine=await link.expect("OK",6000)}catch(e){if(/^เครื่องตอบ/.test(e.message))throw e}reg.app_key=null;
      if(link.closed)throw new Error("ขาดการเชื่อมต่อ USB (ถอดสายหรือพอร์ตหาย)");
      mark("flash","ok",okLine?"เครื่องกำลังรีสตาร์ท":"ไม่เห็นคำตอบ OK — จะยืนยันด้วยการอ่านค่ากลับ");
      cur="verify";mark("verify","wait");await new Promise(r=>setTimeout(r,3000));let info=null;
      for(let i=0;i<6&&!info;i++){link.flush();await link.send("INFO");try{info=await link.expect("INFO",2500)}catch{}}
      if(!info)throw new Error("อ่านค่ากลับไม่ได้");
      if(!info.includes("deveui="+reg.dev_eui)||!info.includes("provisioned=1"))throw new Error("ค่าที่อ่านกลับไม่ตรง: "+info);
      await api(`/provision/${reg.dev_eui}/confirm`,{method:"POST",body:{info}});mark("verify","ok",info);cur="label";
      await link.close();link=null;
      const svg=await (await fetch(`/api/provision/${reg.dev_eui}/label.svg`,{headers:{authorization:"Bearer "+token}})).text();
      $("#pres").innerHTML=`<div class="card"><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:240px"><b class="ok">ติดตั้งสำเร็จ</b><br>ถอดสาย USB แล้วจ่ายไฟเครื่อง (ถ้าเครื่องอยู่ในระยะ gateway จะเชื่อมต่อเอง) จากนั้นไปที่หน้า "อุปกรณ์" เพื่อผูกผู้ป่วยและตั้งเป็น active</div>
        <div id="plabel" style="display:inline-block;margin:8px;padding:8px;border:1px dashed var(--bd);width:220px"><div style="width:120px">${svg.replace(/<\?xml[^>]*>/,"")}</div><div><b>${esc(label)}</b></div><div style="font:12px monospace">${reg.dev_eui}</div></div></div>
        <div class="row"><button class="btn" id="pprint">🖨 พิมพ์ป้าย</button><button class="btn" id="pnext">ติดตั้งเครื่องถัดไป</button></div></div>`;
      $("#pprint").onclick=()=>window.print();$("#pnext").onclick=()=>loadInstall();
      cur="join";mark("join","wait","กำลังรอ… จ่ายไฟเครื่องแล้วรอสักครู่");
      const end=Date.now()+180000;let seen=null;
      while(Date.now()<end&&page==="install"&&!seen){await new Promise(r=>setTimeout(r,5000));const l=await api("/devices");const d=l.find(x=>x.dev_eui===reg.dev_eui);if(d&&d.last_seen)seen=d}
      if(seen)mark("join","ok",`เห็นเครื่องแล้ว RSSI ${seen.rssi??"-"} dBm`);else{const e=document.getElementById("st-join");if(e)e.innerHTML='<span class="mut">○</span> ยังไม่เห็นเครื่อง — ไม่เป็นไร ให้ตรวจที่หน้า "อุปกรณ์" ภายหลัง (ตรวจว่า gateway ออนไลน์)'}
    }catch(e){
      mark(cur,"bad",e.message);
      if(link){await link.close();link=null}
      if(reg&&cur!=="join"&&cur!=="label"){try{await api(`/provision/${reg.dev_eui}/abort`,{method:"POST"});toast("ติดตั้งไม่สำเร็จ ยกเลิกการลงทะเบียนแล้ว ลองใหม่ได้")}catch(x){toast("ยกเลิกการลงทะเบียนไม่สำเร็จ: ลบเครื่อง "+reg.dev_eui+" เองในหน้าอุปกรณ์/ChirpStack")}}
      else toast(e.message);
      $("#pgo").disabled=false}
  }});

/* ---- map: devices, gateways and the links between them (Leaflet, vendored in /vendor/leaflet) ---- */
let _lf=null;
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(_lf)return _lf;
  _lf=new Promise((ok,no)=>{const c=document.createElement("link");c.rel="stylesheet";c.href="/vendor/leaflet/leaflet.css";document.head.appendChild(c);
    const s=document.createElement("script");s.src="/vendor/leaflet/leaflet.js";s.onload=ok;s.onerror=()=>{_lf=null;no(new Error("โหลดไลบรารีแผนที่ไม่สำเร็จ"))};document.head.appendChild(s)});
  return _lf}
const QCOL={good:"#16a34a",fair:"#d97706",weak:"#dc2626"},QTH={good:"ดี",fair:"พอใช้",weak:"อ่อน"};
const PSRC={gps:"GPS (ล่าสุด)",home:"ที่อยู่ที่ลงทะเบียน",gps_old:"GPS (เก่ากว่ากำหนด)"};
const kmTxt=m=>m==null?"-":m>=1000?(m/1000).toFixed(2)+" กม.":m+" ม.";
const mapOpt={links:true,names:true,onlyOn:false};let mapObj=null,mapFitted=false;
const loadMap=guard(async()=>{
  const [d]=await Promise.all([api("/map"),loadLeaflet()]);
  if(page!=="map")return;
  const gwById=Object.fromEntries(d.gateways.map(g=>[g.gateway_id,g])),dvById=Object.fromEntries(d.devices.map(x=>[x.id,x]));
  const noPosDev=d.devices.filter(x=>x.lat==null&&x.lifecycle!=="ready"),noPosGw=d.gateways.filter(g=>g.lat==null);
  if(!$("#mapc")){mapFitted=false;
    $("#main").innerHTML=`${d.restricted?'<div class="warn">บัญชี "ดูอย่างเดียว" ไม่แสดงตำแหน่งบ้านผู้ป่วย/อุปกรณ์ตามนโยบาย PDPA — เห็นเฉพาะเกตเวย์และตารางการเชื่อมต่อ</div>':""}
    <div class="card"><div class="row"><label class="chip"><input type="checkbox" id="mo1" ${mapOpt.links?"checked":""}><span>เส้นเชื่อมต่อ</span></label><label class="chip"><input type="checkbox" id="mo2" ${mapOpt.names?"checked":""}><span>ชื่อบนแผนที่</span></label><label class="chip"><input type="checkbox" id="mo3" ${mapOpt.onlyOn?"checked":""}><span>เฉพาะที่ออนไลน์</span></label><button class="btn" id="mfit">จัดให้พอดี</button><span class="mut" id="mupd"></span></div>
    <div class="row mut" style="font-size:13px"><b>เส้น:</b> <span style="color:${QCOL.good}">━ สัญญาณดี</span> <span style="color:${QCOL.fair}">━ พอใช้</span> <span style="color:${QCOL.weak}">━ อ่อน</span> <span>┅ อุปกรณ์ออฟไลน์/ไม่ทราบสัญญาณ</span> · <b>จุด:</b> 📡 เกตเวย์ · ● อุปกรณ์ (ขอบแดง = ออฟไลน์)</div>
    <div id="mapc" style="height:62vh;min-height:380px;border-radius:12px;margin-top:8px;overflow:hidden;background:var(--bg)"></div><div class="hint" id="mapnote"></div></div><div id="maptb"></div>`;
    if(mapObj){try{mapObj.remove()}catch{}}
    mapObj=L.map("mapc",{zoomControl:true,attributionControl:true}).setView([13.9,100.6],11);
    let bad=0;const tl=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"});
    tl.on("tileerror",()=>{if(++bad===3)$("#mapnote").textContent="โหลดแผนที่พื้นหลังไม่ได้ (เครื่องนี้อาจไม่มีอินเทอร์เน็ต) — ยังแสดงตำแหน่งและเส้นเชื่อมต่อได้"});tl.addTo(mapObj);
    mapObj._lg=L.layerGroup().addTo(mapObj);
    ["mo1","mo2","mo3"].forEach((id,i)=>$("#"+id).onchange=e=>{mapOpt[["links","names","onlyOn"][i]]=e.target.checked;mapRedraw()});
    $("#mfit").onclick=()=>mapFit()}
  window._mapData=d;mapRedraw();
  $("#mupd").textContent="อัปเดต "+new Date().toLocaleTimeString("th-TH",{timeZone:"Asia/Bangkok"});
  const row=x=>{const g=gwById[x.gateway_id],lk=d.links.find(l=>l.device_id===x.id);
    return `<tr><td>${esc(x.label||x.dev_eui)}</td><td>${d.restricted?"":esc(x.patient||"-")}</td><td>${g?esc(g.label||g.gateway_id):'<span class="mut">-</span>'}</td><td>${lk&&lk.quality?`<span style="color:${QCOL[lk.quality]}">● ${QTH[lk.quality]}</span>`:"-"}</td><td>${x.rssi??"-"} / ${x.snr??"-"}</td><td>${kmTxt(lk?.distance_m)}</td><td>${x.lat!=null?PSRC[x.pos_src]:'<span class="mut">ไม่มีพิกัด</span>'}</td><td>${x.offline?'<span class="bad">ออฟไลน์</span>':'<span class="ok">ปกติ</span>'}</td></tr>`};
  $("#maptb").innerHTML=`<div class="card"><h3>การเชื่อมต่ออุปกรณ์ → เกตเวย์</h3>${d.devices.length?`<table><tr><th>อุปกรณ์</th><th>ผู้ป่วย</th><th>เกตเวย์ที่ได้ยินล่าสุด</th><th>สัญญาณ</th><th>RSSI/SNR</th><th>ระยะ</th><th>ที่มาของพิกัด</th><th>สถานะ</th></tr>${d.devices.map(row).join("")}</table>`:'<p class="mut">ยังไม่มีอุปกรณ์</p>'}
   ${noPosGw.length?`<p class="warn" style="margin-top:10px">เกตเวย์ที่ยังไม่มีตำแหน่ง (ไม่แสดงบนแผนที่): ${noPosGw.map(g=>esc(g.label||g.gateway_id)).join(", ")} — ตั้งพิกัดที่เมนูเกตเวย์</p>`:""}
   ${!d.restricted&&noPosDev.length?`<p class="warn" style="margin-top:10px">อุปกรณ์ที่ไม่มีพิกัด (ไม่แสดงบนแผนที่): ${noPosDev.map(x=>esc(x.label||x.dev_eui)).join(", ")} — ใส่ละติจูด/ลองจิจูดที่หน้าผู้ป่วย หรือใช้ชุด GPS</p>`:""}
   <p class="mut" style="font-size:13px">สีของเส้นคิดจาก RSSI/SNR ของข้อมูลล่าสุดที่เกตเวย์ได้ยิน (ดี ≥ −105 dBm, พอใช้ ≥ −115 dBm) · พิกัดอุปกรณ์ใช้ GPS ล่าสุดถ้ามี ไม่งั้นใช้ที่อยู่ที่ลงทะเบียน · ระยะเป็นเส้นตรง</p></div>`;
  if(!mapObj||mapObj._container!==$("#mapc"))return;
  clearInterval(timer);timer=setInterval(()=>{if(page==="map")loadMap();else clearInterval(timer)},30000)});
function mapPts(){const d=window._mapData;return [...d.gateways,...d.devices].filter(x=>x.lat!=null).map(x=>[x.lat,x.lon])}
function mapFit(){const p=mapPts();if(p.length>1)mapObj.fitBounds(p,{padding:[40,40],maxZoom:17});else if(p.length===1)mapObj.setView(p[0],15)}
function mapRedraw(){
  const d=window._mapData,lg=mapObj._lg;lg.clearLayers();
  const gw=Object.fromEntries(d.gateways.map(g=>[g.gateway_id,g]));
  const devs=d.devices.filter(x=>x.lat!=null&&(!mapOpt.onlyOn||!x.offline));
  if(mapOpt.links)d.links.forEach(l=>{const x=d.devices.find(v=>v.id===l.device_id),g=gw[l.gateway_id];if(!x||!g||x.lat==null||g.lat==null)return;if(mapOpt.onlyOn&&x.offline)return;
    const col=QCOL[l.quality]||"#94a3b8";
    L.polyline([[x.lat,x.lon],[g.lat,g.lon]],{color:col,weight:l.quality?3:2,opacity:l.offline?.5:.85,dashArray:l.offline||!l.quality?"6 8":null})
     .bindTooltip(`${esc(x.label||x.dev_eui)} → ${esc(g.label||g.gateway_id)}<br>RSSI ${l.rssi??"-"} dBm · SNR ${l.snr??"-"} dB${l.quality?" · "+QTH[l.quality]:""}<br>ระยะ ${kmTxt(l.distance_m)}`,{sticky:true}).addTo(lg)});
  d.gateways.filter(g=>g.lat!=null).forEach(g=>{
    const ic=L.divIcon({className:"",iconSize:[34,34],iconAnchor:[17,17],html:`<div class="mk mk-gw ${g.offline?"off":""}">📡</div>`});
    const m=L.marker([g.lat,g.lon],{icon:ic,zIndexOffset:500}).addTo(lg);
    m.bindPopup(`<b>${esc(g.label||g.gateway_id)}</b><br>สถานะ: ${g.offline?'<span class="bad">ออฟไลน์'+(g.reason==="radio"?" (ตัวรับสัญญาณเสีย)":"")+"</span>":'<span class="ok">ออนไลน์</span>'}<br>อุปกรณ์ที่ใช้: ${g.devices} เครื่อง<br><span class="mut">${g.gateway_id}<br>พิกัดจาก${g.pos_src==="gps"?" GPS ของเกตเวย์":"ที่ลงทะเบียน"}</span>`);
    if(mapOpt.names)m.bindTooltip(esc(g.label||g.gateway_id),{permanent:true,direction:"bottom",offset:[0,16],className:"mk-tip"})});
  devs.forEach(x=>{const col=x.offline?"#dc2626":(QCOL[x.quality]||"#2f5bea");
    const ic=L.divIcon({className:"",iconSize:[22,22],iconAnchor:[11,11],html:`<div class="mk mk-dv ${x.offline?"off":""}" style="background:${col}"></div>`});
    const m=L.marker([x.lat,x.lon],{icon:ic,zIndexOffset:300}).addTo(lg);
    m.bindPopup(`<b>${esc(x.label||x.dev_eui)}</b>${x.patient?`<br>${esc(x.patient)}`:""}<br>${x.offline?'<span class="bad">ออฟไลน์</span>':'<span class="ok">ออนไลน์</span>'} · แบต ${x.battery??"-"}% · ไฟบ้าน ${x.mains_ok===false?"ดับ":"ปกติ"}<br>สัญญาณ ${x.quality?QTH[x.quality]+" ("+(x.rssi??"-")+" dBm)":"-"}${x.gateway_id&&gw[x.gateway_id]?` → ${esc(gw[x.gateway_id].label||x.gateway_id)}`:""}<br><span class="mut">พิกัดจาก${PSRC[x.pos_src]}</span><br><a target="_blank" rel="noopener" href="https://maps.google.com/?q=${x.lat},${x.lon}">เปิดใน Google Maps</a>`);
    if(mapOpt.names)m.bindTooltip(esc(x.label||x.dev_eui),{permanent:true,direction:"bottom",offset:[0,12],className:"mk-tip"})});
  if(!mapFitted){mapFitted=true;mapFit()}}

/* ---- password change (voluntary and forced) ---- */
function pwScreen(forced){
  authShell(`<form class="auth-card" id="pf" novalidate><div class="auth-logo">${LOGO(56)}</div>
  <h1>${forced?"ตั้งรหัสผ่านใหม่":"เปลี่ยนรหัสผ่าน"}</h1><p class="sub">${forced?"บัญชีนี้ใช้รหัสผ่านชั่วคราว ต้องตั้งรหัสใหม่ก่อนใช้งาน":"เครื่องอื่นที่ล็อกอินอยู่จะถูกออกจากระบบ"}</p>
  <div class="err" id="perr" role="alert" hidden></div>
  <label class="fld"><span>รหัสผ่านปัจจุบัน</span><input id="pc" type="password" autocomplete="current-password"></label>
  <label class="fld"><span>รหัสผ่านใหม่ <span class="mut" style="font-weight:normal">(อย่างน้อย 10 ตัวอักษร)</span></span><div class="pwbox"><input id="pn" type="password" autocomplete="new-password"><button type="button" class="eye" id="eye2" aria-label="แสดงรหัสผ่าน">👁</button></div></label>
  <label class="fld"><span>ยืนยันรหัสผ่านใหม่</span><input id="pn2" type="password" autocomplete="new-password"></label>
  <p class="mut" style="font-size:13px;margin:-4px 0 10px">ห้ามมีชื่อผู้ใช้ · ห้ามเป็นรหัสที่เดาง่ายหรือตัวอักษรซ้ำ ๆ</p>
  <button class="btn p big" id="pgo" type="submit">บันทึกรหัสผ่านใหม่</button>
  <div class="alt" style="margin-top:10px">${forced?'<button type="button" class="btn" id="pout">ออกจากระบบ</button>':'<button type="button" class="btn" id="pback">ยกเลิก</button>'}</div></form>`);
  eyeToggle($("#eye2"),$("#pn"));$("#pc").focus();
  if(forced)$("#pout").onclick=logout;else $("#pback").onclick=()=>render();
  $("#pf").onsubmit=async e=>{e.preventDefault();const err=$("#perr");err.hidden=true;
    try{if($("#pn").value!==$("#pn2").value)throw new Error("รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน");
      busyBtn($("#pgo"),true);
      const r=await api("/me/password",{method:"POST",body:{current_password:$("#pc").value,new_password:$("#pn").value}});

  <div class="card"><h3>ความเร็วในการรับเรื่อง</h3>${rs.accepted?`<div class="row"><span class="tag">รับเรื่อง ${rs.accepted} เคส</span><span class="tag">เฉลี่ย ${sec(rs.accept_avg_s)}</span><span class="tag">มัธยฐาน ${sec(rs.accept_median_s)}</span><span class="tag">P90 ${sec(rs.accept_p90_s)}</span><span class="tag">ภายในเป้า ${rs.target_s} วินาที: <b>${rs.within_target_pct}%</b></span><span class="tag">ปิดเคสเฉลี่ย ${rs.close_avg_min??"-"} นาที</span></div>`:'<p class="mut">ยังไม่มีเคสที่รับเรื่องในช่วงนี้</p>'}</div>
  <div class="card"><h3>แยกตามหมู่บ้าน</h3>${tbl(["หมู่บ้าน","เคส","เหตุผิดพลาด","รับเรื่องเฉลี่ย"],r.by_village.map(v=>[esc(v.village||"(ไม่ระบุ)"),v.cases,v.false_alarm,sec(v.accept_avg_s)]))}</div>
  <div class="card"><h3>ช่วงเวลาที่เกิดเหตุ</h3><div style="display:flex;align-items:flex-end;gap:2px;height:80px">${r.by_hour.map((n,h)=>`<div title="${h}:00 น. — ${n} เคส" style="flex:1;background:var(--pri);height:${Math.max(n?4:1,Math.round(n/mx*76))}px;opacity:${n?1:.25}"></div>`).join("")}</div><div class="mut" style="display:flex;justify-content:space-between"><span>0 น.</span><span>12 น.</span><span>23 น.</span></div>
   <div class="row" style="margin-top:8px">${r.by_weekday.map(d=>`<span class="tag">${esc(d.day)} ${d.cases}</span>`).join("")}</div></div>
  ${r.top_patients.length?`<div class="card"><h3>ผู้ป่วยที่แจ้งบ่อย (10 อันดับ)</h3>${tbl(["ผู้ป่วย","เคส"],r.top_patients.map(p=>[esc(p.name||p.full_name||"-"),p.cases]))}</div>`:""}
  <div class="card"><h3>ระบบ</h3><div class="row"><span class="tag">LINE ส่งสำเร็จ ${r.line.sent}</span><span class="tag">LINE ล้มเหลว ${r.line.failed}</span><span class="tag">อุปกรณ์ใช้งาน ${r.devices.active}</span><span class="tag">ออฟไลน์ตอนนี้ ${r.devices.offline_now}</span><span class="tag">แบตต่ำ ${r.devices.low_battery}</span><span class="tag">ไฟบ้านดับ ${r.devices.mains_lost}</span></div>
   <h4>เกตเวย์ขาดการเชื่อมต่อในช่วงนี้</h4>${r.gateways.length?tbl(["เกตเวย์","จำนวนครั้ง","รวม (นาที)",""],r.gateways.map(g=>[esc(g.label||g.gateway_id),g.outages,g.downtime_min,g.ongoing?"<b class='bad'>ยังขาดอยู่</b>":""])):'<p class="ok">ไม่มี</p>'}</div></div>`;
  $("#rm").onchange=()=>{rq.m=+$("#rm").value;loadReports()};$("#ry").onchange=()=>{rq.y=+$("#ry").value;loadReports()};
  $("#rprint").onclick=()=>{document.body.classList.add("rpt");window.print();setTimeout(()=>document.body.classList.remove("rpt"),500)};
  if($("#rcsv"))$("#rcsv").onclick=guard(async()=>{const x=await fetch("/api/reports/cases.csv?"+q,{headers:{authorization:"Bearer "+token}});if(!x.ok)throw new Error("ดาวน์โหลดไม่สำเร็จ ("+x.status+")");dl(await x.blob(),`sos-cases-${rq.y+543}-${String(rq.m).padStart(2,"0")}.csv`)})});


render();
</script></body></html>
