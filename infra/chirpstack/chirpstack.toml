# ChirpStack v4 — Thailand (AS923-1) only. Secrets come from environment ($VAR) set in docker-compose.yml.
[logging]
  level="info"

[postgresql]
  dsn="postgres://chirpstack:$CHIRPSTACK_DB_PASSWORD@postgres/chirpstack?sslmode=disable"
  max_open_connections=10
  min_idle_connections=0

[redis]
  servers=["redis://redis/"]
  tls_enabled=false
  cluster=false

[network]
  net_id="000000"
  enabled_regions=["as923"]

[api]
  bind="0.0.0.0:8080"
  secret="$CHIRPSTACK_API_SECRET"

[integration]
  enabled=["mqtt"]
  [integration.mqtt]
    server="tcp://mosquitto:1883/"
    username="chirpstack"
    password="$MQTT_CHIRPSTACK_PASSWORD"
    json=true

# Gateway map in the ChirpStack web UI. OpenStreetMap blocks tile requests from ChirpStack's UI when the browser fetches them
# directly ("Access blocked"), so the tiles go through Caddy on the ChirpStack domain (scripts/enable-chirpstack-domain.sh:
# /osm-tiles/*, behind the same IP allow-list, identifying this system to OSM). Through the SSH tunnel (localhost:8080) that
# path does not exist and the map stays grey; everything else works.
[ui]
  tileserver="/osm-tiles/{z}/{x}/{y}.png"
  map_attribution="&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
