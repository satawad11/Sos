# chirpstack: full access to its own topics
user chirpstack
topic readwrite application/#
topic readwrite as923/gateway/#

# backend: read device events, write downlink commands only
user backend
topic read application/+/device/+/event/#
topic write application/+/device/+/command/down

# gateways: username = gateway ID (16 hex). Each gateway sees only its own topics.
pattern readwrite as923/gateway/%u/#
