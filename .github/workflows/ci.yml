name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt pytest httpx pymupdf   # pymupdf: tests/test_pdf.py reads the generated PDF back
      - run: python -m pytest -q
        working-directory: backend
  firmware-host-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror -o /tmp/test_gps firmware/test/test_gps.cpp && /tmp/test_gps
  firmware-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        env: [heltec_v3, heltec_v3_gps, heltec_v2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
        working-directory: firmware
